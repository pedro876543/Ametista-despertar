<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B1A">
<title>Ametista: O Despertar dos Poderes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Direção: crepúsculo frio em um parque em ruínas; tudo o que é poder brilha em ametista.
   Ouro = progresso (nível e experiência). Laranja = perigo vindo dos inimigos. Tema único (noite). */
:root {
  --noite: #0E0B1A;
  --painel: rgba(18, 12, 36, 0.82);
  --ametista: #B57BFF;
  --ametista-forte: #7A3DF0;
  --vida: #FF5C7A;
  --ouro: #F4D78E;
  --perigo: #FF8A4D;
  --papel: #F1ECFA;
  --nevoa: #ABA1C6;
  --f-titulo: "Marcellus SC", "Trajan Pro", Georgia, serif;
  --f-corpo: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; background: var(--noite); color: var(--papel);
  font: 400 15px/1.45 var(--f-corpo); overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ametista); outline-offset: 3px; }
#jogo { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#tela { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud[hidden] { display: none; }
.hud-topo {
  position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 12px) 0 calc(env(safe-area-inset-left, 0px) + 12px);
  transition: opacity .4s;
}
.status { display: grid; gap: 8px; }
.status__linha { display: flex; align-items: center; gap: 10px; }
.gema-wrap { position: relative; width: 40px; height: 40px; flex: none; }
.gema { width: 40px; height: 40px; filter: drop-shadow(0 0 8px rgba(181, 123, 255, .75)); }
.nivel {
  position: absolute; right: -7px; bottom: -6px; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(180deg, #FFE6A6, #E0A63E); color: #2A1A04; font: 700 11px/1 var(--f-corpo); box-shadow: 0 0 0 2px #1A1230;
}
.nivel.sobe { animation: nivelSobe 1s ease; }
@keyframes nivelSobe { 30% { transform: scale(1.5); box-shadow: 0 0 0 2px #1A1230, 0 0 18px #FFE08A; } }
.barras { display: grid; gap: 5px; width: min(40vw, 210px); }
.barra { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px; }
.barra__trilho { position: relative; height: 12px; border-radius: 6px; background: rgba(8, 5, 20, .78); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); overflow: hidden; }
.barra__resto, .barra__fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 6px; }
.barra__resto { background: rgba(255, 255, 255, .6); }
.barra--vida .barra__fill { background: linear-gradient(90deg, #D6335C, #FF7E97); }
.barra--energia .barra__fill { background: linear-gradient(90deg, #6A2FE0, #CDA2FF); }
.barra__num { font: 600 11.5px/1 var(--f-corpo); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; text-shadow: 0 1px 2px #000; }
.barra.pisca .barra__trilho { animation: piscaBarra .5s ease 2; }
@keyframes piscaBarra { 50% { box-shadow: inset 0 0 0 2px #FF7E97; } }
.xp { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px; }
.xp__trilho { position: relative; height: 6px; border-radius: 3px; background: rgba(8, 5, 20, .8); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); overflow: hidden; }
.xp__fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; background: linear-gradient(90deg, #C98A2E, #FFE08A); transition: width .45s ease; }
.xp__num { font: 600 10px/1 var(--f-corpo); color: var(--ouro); font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; white-space: nowrap; }
.poderes { display: flex; gap: 6px; pointer-events: auto; }
.poder { position: relative; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: rgba(14, 9, 30, .8); box-shadow: inset 0 0 0 1px rgba(181, 123, 255, .25); color: var(--nevoa); overflow: visible; }
.poder svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.poder--ativo { color: #fff; background: linear-gradient(160deg, rgba(139, 61, 255, .6), rgba(56, 20, 116, .8)); box-shadow: inset 0 0 0 1px rgba(214, 180, 255, .85), 0 0 12px rgba(181, 123, 255, .5); }
.poder--usando { animation: pulsoPoder .8s ease-in-out infinite; }
@keyframes pulsoPoder { 50% { box-shadow: inset 0 0 0 1px #fff, 0 0 20px rgba(201, 155, 255, .95); } }
.poder--bloqueado svg { opacity: .32; }
.poder__cadeado { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; display: none; place-items: center; background: #1A1230; box-shadow: 0 0 0 1px rgba(181, 123, 255, .45); }
.poder--bloqueado .poder__cadeado { display: grid; }
.poder__cadeado svg { width: 9px; height: 9px; opacity: 1 !important; stroke-width: 2.4; }
.poder__pips { position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); display: none; gap: 2px; padding: 2px 3px; border-radius: 6px; background: #1A1230; }
.poder--ativo .poder__pips { display: flex; }
.poder__pips i { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, .25); }
.poder__pips i.on { background: #FFE08A; box-shadow: 0 0 4px #FFE08A; }
.poder__recarga { position: absolute; inset: 0; border-radius: 9px; pointer-events: none; background: conic-gradient(rgba(6, 3, 14, .72) calc(var(--p, 0) * 1turn), transparent 0); }
.poder--revelado { animation: revelar 1.2s ease 2; }
@keyframes revelar { 50% { transform: scale(1.25); box-shadow: inset 0 0 0 1px #fff, 0 0 26px #E2C8FF; } }
.hud-dir { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
.onda { display: grid; justify-items: end; gap: 2px; font: 600 12px/1.15 var(--f-corpo); padding: 6px 11px; border-radius: 12px; background: var(--painel); box-shadow: inset 0 0 0 1px rgba(181, 123, 255, .3); white-space: nowrap; text-align: right; }
.onda b { font-weight: 600; }
.onda small { font: 500 11px/1.1 var(--f-corpo); color: var(--nevoa); }
.onda small:empty { display: none; }
.btn-redondo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--painel); box-shadow: inset 0 0 0 1px rgba(181, 123, 255, .4); }
.btn-redondo svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
.aviso {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 140px); transform: translate(-50%, -6px);
  width: max-content; max-width: min(86vw, 470px); text-align: center; padding: 9px 16px; border-radius: 12px;
  background: rgba(14, 9, 30, .84); box-shadow: inset 0 0 0 1px rgba(181, 123, 255, .45);
  font: 600 14px/1.35 var(--f-corpo); opacity: 0; transition: opacity .3s, transform .3s;
}
.aviso.visivel { opacity: 1; transform: translate(-50%, 0); }
.com-chefe .aviso { top: calc(env(safe-area-inset-top, 0px) + 212px); }
.toast {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 196px); transform: translateX(-50%);
  width: max-content; max-width: min(80vw, 380px); text-align: center; padding: 8px 14px; border-radius: 10px;
  background: rgba(40, 14, 40, .9); box-shadow: inset 0 0 0 1px rgba(255, 126, 151, .45); font: 600 13px/1.35 var(--f-corpo);
  opacity: 0; transition: opacity .25s;
}
.toast.visivel { opacity: 1; }
.com-chefe .toast { top: calc(env(safe-area-inset-top, 0px) + 270px); }
.status__extra { display: flex; gap: 6px; align-items: center; pointer-events: auto; }
.moedas { display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 7px; border-radius: 999px; background: var(--painel); box-shadow: inset 0 0 0 1px rgba(244, 215, 142, .35); font: 700 12.5px/1 var(--f-corpo); color: var(--ouro); font-variant-numeric: tabular-nums; }
.moedas svg { width: 16px; height: 16px; }
.moedas.ganhou { animation: moedaPulso .4s ease; }
@keyframes moedaPulso { 40% { transform: scale(1.12); box-shadow: inset 0 0 0 1px #FFE08A, 0 0 12px rgba(255, 224, 138, .6); } }
.pontos { height: 26px; padding: 0 11px; border-radius: 999px; font: 700 11.5px/1 var(--f-corpo); color: #2A1A04; background: linear-gradient(180deg, #FFE6A6, #E0A63E); box-shadow: 0 0 14px rgba(255, 214, 120, .45); animation: pontosPulso 1.6s ease-in-out infinite; }
.pontos[hidden] { display: none; }
@keyframes pontosPulso { 50% { box-shadow: 0 0 22px rgba(255, 214, 120, .85); } }

/* Barra do chefe */
.chefe { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 136px); width: min(90vw, 420px); display: grid; gap: 4px; pointer-events: none; }
.chefe[hidden] { display: none; }
.chefe__nome { display: flex; gap: 8px; align-items: baseline; justify-content: center; font: 400 15px/1.1 var(--f-titulo); letter-spacing: .1em; color: #FFD9B8; text-shadow: 0 2px 4px #000; }
.chefe__nome span { font: 500 11px/1 var(--f-corpo); letter-spacing: .04em; color: var(--nevoa); }
.chefe__vida { position: relative; height: 10px; border-radius: 5px; background: rgba(8, 5, 20, .88); box-shadow: inset 0 0 0 1px rgba(255, 180, 140, .4); overflow: hidden; }
.chefe__vida i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; background: linear-gradient(90deg, #B83A1E, #FF8A4D); transition: width .2s; }
.chefe__abalo { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; }
.chefe__abalo span { font: 600 10px/1 var(--f-corpo); letter-spacing: .1em; text-transform: uppercase; color: var(--nevoa); text-shadow: 0 1px 2px #000; }
.chefe__abalo div { position: relative; height: 5px; border-radius: 3px; background: rgba(8, 5, 20, .88); overflow: hidden; }
.chefe__abalo i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; background: #E9E2FF; transition: width .15s; }
.chefe.exposto .chefe__abalo i { background: var(--perigo); animation: piscaAbalo .4s infinite alternate; }
.chefe.exposto .chefe__abalo span { color: var(--perigo); }
@keyframes piscaAbalo { to { opacity: .45; } }
.chefe__tag { font: 600 9.5px/1 var(--f-corpo); letter-spacing: .18em; padding-left: .18em; text-transform: uppercase; color: var(--perigo); text-align: center; text-shadow: 0 1px 2px #000; }
.chefe__marca { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255, 240, 220, .85); display: none; }
.chefe--boss .chefe__marca { display: block; }
.chefe--boss .chefe__vida { height: 13px; box-shadow: inset 0 0 0 1px rgba(255, 214, 140, .7), 0 0 14px rgba(255, 150, 60, .35); }
.chefe--boss .chefe__vida i { background: linear-gradient(90deg, #8E1E2E, #E0402E 55%, #FFB347); }
.chefe--boss .chefe__nome { color: #FFE2A8; font-size: 17px; }
.chefe--boss .chefe__tag { color: #FFD27A; }
.chefe.sem-medidor .chefe__abalo div { visibility: hidden; }

/* Anúncios grandes (novo nível, evolução, chefe) */
.anuncio { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.94); display: grid; justify-items: center; gap: 6px; text-align: center; width: max-content; max-width: 90vw; opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s; }
.anuncio.visivel { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.anuncio__pre { font: 600 12px/1.2 var(--f-corpo); letter-spacing: .3em; padding-left: .3em; text-transform: uppercase; color: var(--ouro); text-shadow: 0 2px 8px #000; }
.anuncio__titulo { font: 400 clamp(28px, 7vw, 46px)/1.05 var(--f-titulo); letter-spacing: .08em; color: #fff; text-shadow: 0 0 24px rgba(181, 123, 255, .9), 0 2px 6px #000; }
.anuncio__sub { font: 500 14px/1.4 var(--f-corpo); color: #E5DAFA; text-shadow: 0 2px 6px #000; max-width: 34ch; }
.anuncio--chefe .anuncio__titulo { color: #FFD9B8; text-shadow: 0 0 24px rgba(255, 120, 60, .8), 0 2px 6px #000; }
.anuncio--chefe .anuncio__sub { font-style: italic; }
.com-chefe .anuncio { top: 47%; }
.anuncio.anuncio--chefe-intro { top: 76%; }
.anuncio--chefe-intro .anuncio__titulo { color: #FFD9B8; text-shadow: 0 0 24px rgba(255, 120, 60, .8), 0 2px 6px #000; }
.anuncio--chefe-intro .anuncio__sub { font-style: italic; }

/* ---------- Controles de toque ---------- */
.controles { position: absolute; inset: 0; pointer-events: none; display: none; transition: opacity .4s; }
.toque-ativo .controles { display: block; }
.joystick { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 34px); bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); width: 124px; height: 124px; border-radius: 50%; opacity: .4; transition: opacity .2s; }
.joystick.ativo { opacity: 1; transition: none; margin: -62px 0 0 -62px; }
.joystick__base { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(181, 123, 255, .14), rgba(181, 123, 255, .04) 70%); box-shadow: inset 0 0 0 2px rgba(214, 180, 255, .4); }
.joystick__pino { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #EADBFF, #9E6BFF 60%, #5B2BB5); box-shadow: 0 4px 14px rgba(0, 0, 0, .45); }
.acoes { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 166px; height: 280px; pointer-events: none; }
.acao {
  position: absolute; pointer-events: auto; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 3px;
  color: #fff; font: 700 9.5px/1 var(--f-corpo); letter-spacing: .04em; text-transform: uppercase; touch-action: none;
  transition: transform .08s, filter .2s;
}
.acao[hidden] { display: none; }
.acao svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.acao--tk { right: 0; bottom: 0; width: 82px; height: 82px; background: radial-gradient(circle at 50% 32%, rgba(181, 123, 255, .6), rgba(70, 26, 150, .85)); box-shadow: inset 0 0 0 2px rgba(214, 180, 255, .75), 0 0 24px rgba(139, 61, 255, .45); }
.acao--tk svg { width: 30px; height: 30px; }
.acao--tk.sem-alvo { filter: saturate(.35) brightness(.75); }
.acao--tk.segurando { background: radial-gradient(circle at 50% 32%, #E2C8FF, #8B3DFF 72%); box-shadow: inset 0 0 0 2px #fff, 0 0 32px rgba(181, 123, 255, .85); }
.acao--rajada { right: 94px; bottom: 2px; width: 70px; height: 70px; background: radial-gradient(circle at 50% 32%, rgba(236, 140, 255, .62), rgba(108, 26, 150, .9)); box-shadow: inset 0 0 0 2px rgba(244, 196, 255, .8), 0 0 22px rgba(214, 90, 255, .45); }
.acao--rajada svg { width: 27px; height: 27px; }
.acao.aparecendo { animation: aparecer 1s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes aparecer { from { transform: scale(.2); opacity: 0; } }
.acao--empurrar { right: 105px; bottom: 230px; width: 48px; height: 48px; background: rgba(38, 20, 78, .85); box-shadow: inset 0 0 0 2px rgba(214, 180, 255, .5); }
.acao--empurrar svg { width: 19px; height: 19px; }
.acao--esquiva { right: 101px; bottom: 86px; width: 56px; height: 56px; background: rgba(24, 36, 66, .88); box-shadow: inset 0 0 0 2px rgba(158, 230, 255, .5); }
.acao--esquiva svg { width: 21px; height: 21px; }
.acao--escudo { right: 11px; bottom: 96px; width: 60px; height: 60px; background: radial-gradient(circle at 50% 32%, rgba(170, 176, 255, .55), rgba(46, 36, 140, .9)); box-shadow: inset 0 0 0 2px rgba(206, 208, 255, .75), 0 0 18px rgba(120, 110, 255, .4); }
.acao--escudo svg { width: 23px; height: 23px; }
.acao--escudo.ligado { background: radial-gradient(circle at 50% 32%, #E6E4FF, #6E62FF 70%); box-shadow: inset 0 0 0 2px #fff, 0 0 30px rgba(160, 150, 255, .9); }
.acao--explosao { right: 12px; bottom: 170px; width: 58px; height: 58px; background: radial-gradient(circle at 50% 32%, rgba(214, 160, 255, .7), rgba(84, 18, 168, .92)); box-shadow: inset 0 0 0 2px rgba(236, 210, 255, .8), 0 0 20px rgba(160, 80, 255, .45); }
.acao--explosao svg { width: 24px; height: 24px; }
.acao--explosao.carregando { background: radial-gradient(circle at 50% 32%, #fff, #A35BFF 70%); }
.acao--empurrar span, .acao--esquiva span, .acao--escudo span, .acao--explosao span { font-size: 7.5px; letter-spacing: .02em; }
.acao--gravidade { right: 99px; bottom: 156px; width: 60px; height: 60px; background: radial-gradient(circle at 50% 32%, rgba(150, 128, 255, .62), rgba(36, 16, 104, .93)); box-shadow: inset 0 0 0 2px rgba(206, 196, 255, .8), 0 0 20px rgba(110, 90, 255, .45); }
.acao--gravidade svg { width: 24px; height: 24px; }
.acao--gravidade span { font-size: 7.5px; letter-spacing: .02em; }
.acao--escudo .pips-acao, .acao--explosao .pips-acao, .acao--gravidade .pips-acao { top: 5px; }
.acao--gravidade .pips-acao i { width: 4px; height: 4px; }
.poder--pressagio { color: #FFE9B0; box-shadow: inset 0 0 0 1px rgba(255, 224, 138, .9), 0 0 14px rgba(255, 214, 120, .55); animation: pressagio 2.6s ease-in-out infinite; }
.poder--pressagio .poder__cadeado { box-shadow: 0 0 0 1px #FFE08A; }
@keyframes pressagio { 50% { box-shadow: inset 0 0 0 1px #fff, 0 0 24px rgba(255, 224, 138, .95); } }
.acao--escudo .pips-acao i, .acao--explosao .pips-acao i { width: 4px; height: 4px; }
.acao.pressionado { transform: scale(.92); }
.acao.sem-energia { filter: grayscale(.7) brightness(.7); }
.acao.nega { animation: nega .3s; }
@keyframes nega { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.recarga { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: conic-gradient(rgba(6, 3, 14, .72) calc(var(--p, 0) * 1turn), transparent 0); }
.pips-acao { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
.pips-acao i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, .3); }
.pips-acao i.on { background: #FFE08A; box-shadow: 0 0 5px #FFE08A; }
.teclas {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: max-content; max-width: 96vw; text-align: center; font: 500 12px/1.4 var(--f-corpo); color: var(--nevoa);
  padding: 6px 12px; border-radius: 999px; background: rgba(14, 9, 30, .66);
}
.toque-ativo .teclas { display: none; }
.em-cena .controles, .em-cena .hud-topo, .em-cena .chefe, .em-cena .teclas { opacity: 0; pointer-events: none; }

/* ---------- Telas sobrepostas ---------- */
#camada { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background: radial-gradient(ellipse at center, rgba(14, 8, 30, .35), rgba(6, 3, 14, .78)); }
#camada[hidden] { display: none; }
.cartao {
  width: min(100%, 440px); max-height: 100%; overflow-y: auto; padding: 26px 22px; border-radius: 20px; display: grid; gap: 14px; text-align: center;
  background: linear-gradient(170deg, rgba(34, 20, 66, .95), rgba(14, 9, 30, .97));
  box-shadow: inset 0 0 0 1px rgba(181, 123, 255, .38), 0 30px 60px rgba(0, 0, 0, .55);
  animation: cartaoEntra .35s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes cartaoEntra { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.cartao--poder { box-shadow: inset 0 0 0 1px rgba(236, 196, 255, .7), 0 0 60px rgba(181, 123, 255, .35), 0 30px 60px rgba(0, 0, 0, .55); }
.logo {
  margin: 0; font: 400 clamp(40px, 12vw, 62px)/1 var(--f-titulo); letter-spacing: .14em; padding-left: .14em;
  background: linear-gradient(180deg, #FFFFFF 10%, #DCC0FF 48%, #8B3DFF 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(139, 61, 255, .55));
}
.subtitulo { font: 400 12.5px/1.2 var(--f-titulo); letter-spacing: .34em; padding-left: .34em; text-transform: uppercase; color: #D9B8FF; }

.item.selecionado { box-shadow: inset 0 0 0 2px #FFE08A, 0 0 12px rgba(255, 224, 138, .35); }
/* Celular deitado: avisos e barra do chefe descem para o rodapé; telas mais compactas */
@media (orientation: landscape) and (max-height: 520px) {
  .barras { width: min(30vw, 190px); }
  .aviso { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); max-width: min(44vw, 400px); font-size: 13px; padding: 8px 14px; }
  .com-chefe .aviso { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
  .toast, .com-chefe .toast { top: calc(env(safe-area-inset-top, 0px) + 12px); max-width: min(36vw, 320px); }
  .chefe { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(42vw, 360px); }
  .anuncio { top: 40%; }
  .acoes { height: 232px; width: 230px; }
  .acao--empurrar { right: 180px; bottom: 16px; }
  .acao--supremacia { right: 172px; bottom: 80px; }
  .interagir { bottom: calc(env(safe-area-inset-bottom, 0px) + 178px); max-width: 30vw; }
  .cartao { width: min(100%, 640px); padding: 16px 20px; gap: 10px; }
  .logo { font-size: 42px; }
  .texto { font-size: 14px; }
  .titulo-cartao { font-size: 24px; }
  .estatisticas { grid-template-columns: repeat(4, 1fr); }
  .estat strong { font-size: 18px; }
  .lista-controles { font-size: 13px; padding: 10px 12px; }
  .icone-poder { width: 58px; height: 58px; }
  .icone-poder svg { width: 32px; height: 32px; }
}
@media (max-width: 400px) {
  .poder { width: 26px !important; height: 26px !important; border-radius: 7px; }
  .poder svg { width: 15px !important; height: 15px !important; }
  .poderes { gap: 4px !important; }
}
@media (max-width: 430px) {
  .poder { width: 30px; height: 30px; border-radius: 8px; }
  .poder svg { width: 17px; height: 17px; }
  .poderes { gap: 5px; }
  .barras { width: min(42vw, 180px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

const rajadaParaNivel = (nivel) => (nivel >= 4 ? 3 : nivel >= 3 ? 2 : nivel >= 2 ? 1 : 0);
function nivelDoPoder(poder, nivel, liberado) {
  if (poder === 'rajada') return rajadaParaNivel(nivel);
  if (!liberado) return 0;
  const t = NIVEL_EVOLUCAO[poder];
  return nivel >= t[3] ? 3 : nivel >= t[2] ? 2 : 1;
}

  if (n) {
    const vn = o.vx * n.x + o.vy * n.y;
    if (vn < 0) { o.vx = (o.vx - 1.6 * vn * n.x) * 0.7; o.vy = (o.vy - 1.6 * vn * n.y) * 0.7; }
    if (vel > 260) {
      if (o.energizadoVoo) { Combate.estouroEnergizado(o, null); o.energizadoVoo = false; }
      Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 2); Efeitos.poeira(o.x, o.y, 5); Som.tocar('impacto');
      if (o.def.quebra && o.lancado) { avisarErro(o); Combate.quebrar(o); return; }
    }
  }
  if (o.lancado && o.z < 80 && vel > 140) {
    for (const e of Jogo.inimigos) {
      if (!alvejavel(e) || o.acertou.has(e.id)) continue;
      const r = o.raio + e.raio;
      if (dist2(o, e) < r * r) {
        o.acertou.add(e.id);
        const en = o.energizadoVoo;
        const dano = Math.round(o.def.dano * clamp(vel / 700, 0.6, 1.3) * Perfil.mult('telecinese', 'dano') * (en ? CONFIG.combos.energizado : 1));
        Combate.danoInimigo(e, dano, normalizar(o.vx, o.vy), 300 + o.def.peso * 90, 1.1, { derrubar: true, fonte: 'objeto', rotulo: en ? 'Energizado!' : undefined, cor: en ? '#E6C8FF' : undefined });
        if (en) { Combate.estouroEnergizado(o, e); o.energizadoVoo = false; }
        Jogo.stats.acertos++;
        o.vx *= -0.25; o.vy *= -0.25; o.vz = 160;
        if (o.def.quebra) { Combate.quebrar(o); return; }
      }
    }
  }
  if (vel > 200) {
    for (const b of Jogo.objetos) {
      if (b === o || b.estado !== 'chao' || b.def.peso > 3) continue;
      const r = o.raio + b.raio;
      if (dist2(o, b) < r * r) {
        const nb = normalizar(b.x - o.x, b.y - o.y);
        b.estado = 'voando'; b.vx = nb.x * vel * 0.6; b.vy = nb.y * vel * 0.6; b.vz = 120; b.vrot = 8; b.lancado = true; b.doJogador = false; b.acertou = new Set();
        o.vx *= 0.5; o.vy *= 0.5;
        Som.tocar('impacto');
      }
    }
  }
}

/* ========== 11. RAJADA ========== */
const Rajada = {
  dados() {
    const n = Jogo.jogador.rajadaNivel;
    if (!n) return null;
    const b = CONFIG.rajada.niveis[n];
    return { ...b, dano: Math.round(b.dano * Perfil.mult('rajada', 'dano')), alcance: b.alcance * Perfil.mult('rajada', 'alcance'), recarga: b.recarga * Perfil.mult('rajada', 'recarga') };
  },
  disparar(dirManual) {
    const j = Jogo.jogador, d = this.dados();
    if (j.morto || !d) return;
    if (j.cargaRajada > 0 || j.disparos > 0) return;
    if (j.recargaRajada > 0) { Som.tocar('erro'); Entrada.negar('rajada'); return; }
    if (j.energia < d.custo) { Som.tocar('erro'); Entrada.negar('rajada'); Hud.toast('Energia insuficiente para a Rajada.'); Hud.piscarEnergia(); return; }
    j.energia -= d.custo; j.esperaRegen = CONFIG.jogador.esperaRegen;
    j.recargaRajada = d.recarga + d.preparo + d.intervalo * (d.tiros - 1);
    j.cargaRajada = d.preparo; j.dirRajada = dirManual || null;
    const alvo = dirManual ? null : this.alvo();
    if (dirManual) j.olhar = { ...dirManual };
    else if (alvo) j.olhar = normalizar(alvo.x - j.x, alvo.y - j.y);
    j.dir = dirDe(j.olhar);
    Som.tocar('carga' + j.rajadaNivel);
    // Telecinese + Rajada: o objeto segurado absorve parte da energia
    const o = j.segurando;
    if (o && !o.energizado) { o.energizado = true; Efeitos.texto(o.x, o.y, o.z + 30, 'Energizado!', '#E6C8FF'); Som.tocar('energizado'); Fluxo.evento('energizou'); }
    Fluxo.evento('rajada');
  },
  alvo() {
    const j = Jogo.jogador, d = this.dados(), alcance = d ? d.alcance : 500;
    let susp = null, md = alcance ** 2;
    for (const e of Jogo.inimigos) if (e.estado === 'suspenso') { const q = dist2(j, e); if (q < md) { md = q; susp = e; } }
    if (susp) return susp;
    return Telecinese.alvoAutomatico(j, alcance);
  },
  atualizar(dt) {
    const j = Jogo.jogador, d = this.dados();
    if (d && j.cargaRajada > 0) {
      j.cargaRajada -= dt;
      const gy = 26;
      if (Math.random() < dt * 50) {
        const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 30;
        Efeitos.particula(j.x + Math.cos(a) * r, j.y + Math.sin(a) * r * 0.7, gy + Math.random() * 20, { segue: true, atraso: 0, cor: j.rajadaNivel === 3 ? '#FF9BF0' : '#E2C8FF', vida: 0.35, tam: 1.6 + Math.random(), aditivo: true, forma: Visual.forma() });
      }
      if (j.cargaRajada <= 0) { j.disparos = d.tiros; j.proxDisparo = 0; }
    }
    if (d && j.disparos > 0) {
      j.proxDisparo -= dt;
      if (j.proxDisparo <= 0) { this.lancar(d.tiros - j.disparos); j.disparos--; j.proxDisparo = d.intervalo; }
    }
    // projéteis
    for (let i = Jogo.projeteis.length - 1; i >= 0; i--) {
      const p = Jogo.projeteis[i];
      p.t += dt;
      p.rastro.push({ x: p.x, y: p.y }); if (p.rastro.length > 9) p.rastro.shift();
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.dist += Math.hypot(p.vx, p.vy) * dt;
      let fim = false;
      for (const e of Jogo.inimigos) {
        if (!alvejavel(e)) continue;
        if (p.ignorar && p.ignorar.has(e.id)) continue;
        if (dist2(p, e) < (p.raio + e.raio) ** 2) { Combate.acertoRajada(p, e); if (p.perfura > 0 && categoria(e) === 'comum') { p.perfura--; (p.ignorar = p.ignorar || new Set()).add(e.id); Efeitos.texto(e.x, e.y, 84, 'Perfurou!', '#F3D2FF'); continue; } fim = true; break; }
      }
      if (!fim) {
        for (let k = Jogo.projeteisInimigos.length - 1; k >= 0; k--) {
          const s = Jogo.projeteisInimigos[k];
          if (!s.refletido && dist2(p, s) < (p.raio + s.raio + 4) ** 2) {
            Jogo.projeteisInimigos.splice(k, 1);
            Efeitos.texto(s.x, s.y, 40, 'destruído', '#DCC0FF'); Efeitos.faiscas(s.x, s.y, 30, 10, '#FFB27A');
            Som.tocar('bloqueado');
          }
        }
        if (tocaEstatico(p) || foraDosLimites(p) || p.dist > p.alcance) {
          fim = true;
          Jogo.clarões.push({ x: p.x, y: p.y, z: p.z, t: 0, nivel: p.nivel, tipo: 'fim' });
          if (p.havia) { Efeitos.texto(p.x, p.y, 30, 'errou', '#A69CC0'); Som.tocar('errou'); }
        }
      }
      if (fim) Jogo.projeteis.splice(i, 1);
    }
  },
  lancar(indice) {
    const j = Jogo.jogador, nv = j.rajadaNivel, d = this.dados();
    let dir = j.dirRajada;
    if (!dir) { const alvo = this.alvo(); dir = alvo ? normalizar(alvo.x - j.x, alvo.y - j.y) : { ...j.olhar }; }
    if (d.tiros > 1) dir = girar(dir, [0, -0.07, 0.07][indice % 3]);
    const ox = j.x + dir.x * 16, oy = j.y + dir.y * 12;
    Jogo.projeteis.push({ x: ox, y: oy, z: 26, vx: dir.x * d.velocidade, vy: dir.y * d.velocidade, raio: d.raio, dano: d.dano, nivel: nv, dist: 0, alcance: d.alcance, empurrao: d.empurrao, t: 0, rastro: [], havia: inimigosVivos().length > 0, gira: Math.random() * 6 });
    j.olhar = { ...dir }; j.dir = dirDe(dir); j.poseRajada = 0.22;
    Jogo.clarões.push({ x: ox, y: oy, z: 26, t: 0, nivel: nv, tipo: 'disparo' });
    j.kx -= dir.x * (nv === 2 ? 120 : 50); j.ky -= dir.y * (nv === 2 ? 120 : 50);
    Jogo.cam.tremor = Math.max(Jogo.cam.tremor, nv === 2 ? 4 : 2);
    Som.tocar('rajada' + nv); vibrar(nv === 2 ? 22 : 12);
    Jogo.stats.rajadas++;
  },
};

/* ========== 11b. ESCUDO ========== */
const Escudo = {
  dados() {
    const n = Jogo.jogador.escudoNivel;
    if (!n) return null;
    const b = CONFIG.escudo.niveis[n];
    return { ...b, duracao: b.duracao * Perfil.mult('escudo', 'duracao'), resistencia: Math.round(b.resistencia * Perfil.mult('escudo', 'resistencia')), recarga: b.recarga * Perfil.mult('escudo', 'recarga') };
  },
  ativar() {
    const j = Jogo.jogador, d = this.dados();
    if (j.morto || !d || j.escudo) return;
    if (j.recargaEscudo > 0) { Som.tocar('erro'); Entrada.negar('escudo'); return; }
    if (j.energia < d.custo) { Som.tocar('erro'); Entrada.negar('escudo'); Hud.toast('Energia insuficiente para o Escudo.'); Hud.piscarEnergia(); return; }
    j.energia -= d.custo; j.esperaRegen = CONFIG.jogador.esperaRegen;
    j.escudo = { t: 0, dur: d.duracao, hp: d.resistencia, max: d.resistencia, raio: d.raio, nivel: j.escudoNivel, area: !!d.area, reflete: !!d.reflete, reducao: d.reducao, flash: 0, repelidos: {} };
    j.recargaEscudo = j.recargaEscudoTotal = d.duracao + d.recarga;
    Jogo.stats.escudos++;
    Som.tocar('escudo'); vibrar(15);
    const forma = Visual.forma();
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      Efeitos.particula(j.x + Math.cos(a) * d.raio * 1.6, j.y + Math.sin(a) * d.raio * 1.2, 22, { vx: -Math.cos(a) * 90, vy: -Math.sin(a) * 70, vz: 20, cor: '#C9C6FF', vida: 0.4, tam: 2, aditivo: true, forma });
    }
    Fluxo.evento('escudo');
  },
  perfeito() { const s = Jogo.jogador.escudo; return !!s && s.t < CONFIG.escudo.janelaPerfeita; },
  atualizar(dt) {
    const j = Jogo.jogador, s = j.escudo;
    j.recargaEscudo = Math.max(0, j.recargaEscudo - dt);
    if (!s) return;
    s.t += dt; s.flash = Math.max(0, s.flash - dt);
    if (j.morto || s.t >= s.dur) { this.terminar(false); return; }
    // nível 3: a cúpula empurra para fora quem tenta entrar
    if (s.area) {
      for (const e of Jogo.inimigos) {
        if (!alvejavel(e) || categoria(e) === 'boss' || e.tipo === 'onix') continue;
        const dx = e.x - j.x, dy = e.y - j.y, d = Math.hypot(dx, dy) || 1, lim = s.raio + e.raio;
        if (d >= lim) continue;
        const n = { x: dx / d, y: dy / d };
        e.x = j.x + n.x * lim; e.y = j.y + n.y * lim;
        if ((s.repelidos[e.id] || 0) <= s.t) {
          s.repelidos[e.id] = s.t + 0.7;
          Combate.danoInimigo(e, 3, n, 380, 0.6, { fonte: 'escudo', rotulo: 'Repelido!' });
          this.desgastar(4);
          if (!j.escudo) return;
        }
      }
    }
  },
  desgastar(qtd) {
    const s = Jogo.jogador.escudo;
    if (!s) return;
    s.hp -= qtd; s.flash = 0.15;
    if (s.hp <= 0) this.terminar(true);
  },
  // Devolve quanto dano ainda chega ao jogador
  absorver(dano) {
    const j = Jogo.jogador, s = j.escudo;
    if (!s) return dano;
    s.flash = 0.18;
    if (s.t < CONFIG.escudo.janelaPerfeita) {
      Efeitos.texto(j.x, j.y, 70, 'Bloqueio perfeito!', '#C9C6FF');
      j.energia = Math.min(j.energiaMax, j.energia + CONFIG.escudo.energiaPerfeita);
      Jogo.stats.bloqueiosPerfeitos++; Som.tocar('escudoPerfeito'); vibrar(20);
      Jogo.hitstop = Math.max(Jogo.hitstop, 0.06);
      s.absorvido = (s.absorvido || 0) + 15;
      Fluxo.evento('bloqueioPerfeito');
      return 0;
    }
    Jogo.stats.bloqueiosEscudo++;
    s.hp -= dano; s.absorvido = (s.absorvido || 0) + dano;
    if (s.hp > 0) { Efeitos.texto(j.x, j.y, 66, 'Bloqueado', '#C9C6FF'); Som.tocar('escudoBloqueio'); vibrar(12); Fluxo.evento('bloqueio'); return 0; }
    const resto = Math.round(-s.hp * (1 - s.reducao));
    this.terminar(true);
    return resto;
  },
  terminar(quebrou) {
    const j = Jogo.jogador, s = j.escudo;
    if (!s) return;
    j.escudo = null; j.fimEscudo = Jogo.tempo; j.absorvidoAnt = s.absorvido || 0;
    if (quebrou) {
      Efeitos.texto(j.x, j.y, 84, 'O escudo quebrou!', '#FF9AB0'); Som.tocar('escudoQuebra'); vibrar([20, 20, 30]);
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 160;
        Efeitos.particula(j.x + Math.cos(a) * s.raio, j.y + Math.sin(a) * s.raio * 0.8, 20 + Math.random() * 30, { vx: Math.cos(a) * v, vy: Math.sin(a) * v, vz: 80 + Math.random() * 120, cor: '#C9C6FF', vida: 0.6, tam: 2.2, gravidade: true, quadrado: true });
      }
    } else {
      for (let i = 0; i < 10; i++) { const a = Math.random() * Math.PI * 2; Efeitos.particula(j.x + Math.cos(a) * s.raio, j.y + Math.sin(a) * s.raio * 0.8, 24, { vz: 40, cor: '#C9C6FF', vida: 0.5, tam: 1.8, aditivo: true }); }
    }
  },
  // Um projétil inimigo encostou no escudo. Devolve true se ele continua no mundo (refletido).
  projetil(p) {
    const s = Jogo.jogador.escudo, perfeito = s.t < CONFIG.escudo.janelaPerfeita;
    if (s.reflete || perfeito) {
      this.refletir(p);
      s.flash = 0.18;
      if (perfeito) { Jogo.stats.bloqueiosPerfeitos++; Som.tocar('escudoPerfeito'); }
      else this.desgastar(Math.ceil(p.dano * 0.4));
      return true;
    }
    const passa = this.absorver(p.dano);
    if (passa > 0) Combate.danoJogador(passa, normalizar(p.vx, p.vy), { semEscudo: true });
    Efeitos.faiscas(p.x, p.y, 26, 8, '#C9C6FF');
    return false;
  },
  refletir(p) {
    const alvo = p.dono && alvejavel(p.dono) ? p.dono : Telecinese.alvoAutomatico(p, 700);
    const v = Math.max(300, Math.hypot(p.vx, p.vy)) * 1.2;
    const d = alvo ? normalizar(alvo.x - p.x, alvo.y - p.y) : normalizar(-p.vx, -p.vy);
    Object.assign(p, { vx: d.x * v, vy: d.y * v, refletido: true, dist: 0, alcance: 760, dano: Math.round(p.dano * 1.5), esquivado: false, guiado: false });
    Efeitos.texto(p.x, p.y, 50, 'Refletido!', '#C9C6FF'); Efeitos.faiscas(p.x, p.y, 30, 8, '#E2C8FF');
    Som.tocar('reflexo'); Jogo.stats.reflexos++;
    Fluxo.evento('reflexo');
  },
};

/* ========== 11c. EXPLOSAO ========== */
const Explosao = {
  dados() {
    const n = Jogo.jogador.explosaoNivel;
    if (!n) return null;
    const b = CONFIG.explosao.niveis[n];
    return { ...b, dano: Math.round(b.dano * Perfil.mult('explosao', 'dano')), raio: b.raio * Perfil.mult('explosao', 'alcance'), recarga: b.recarga * Perfil.mult('explosao', 'recarga') };
  },
  ativar() {
    const j = Jogo.jogador, d = this.dados();
    if (j.morto || !d) return;
    if (j.cargaExplosao > 0 || j.segundaOnda > 0 || j.cargaRajada > 0 || j.disparos > 0) return;
    if (j.recargaExplosao > 0) { Som.tocar('erro'); Entrada.negar('explosao'); return; }
    if (j.energia < d.custo) { Som.tocar('erro'); Entrada.negar('explosao'); Hud.toast('Energia insuficiente para a Explosão.'); Hud.piscarEnergia(); return; }
    j.energia -= d.custo; j.esperaRegen = CONFIG.jogador.esperaRegen;
    // Escudo + Explosão: a energia guardada no escudo vira contra-ataque
    const absorvido = j.escudo ? j.escudo.absorvido || 0 : Jogo.tempo - j.fimEscudo < 1 ? j.absorvidoAnt : -1;
    j.contraAtaque = absorvido >= 0 ? clamp(CONFIG.combos.contraMin + absorvido / 80, CONFIG.combos.contraMin, CONFIG.combos.contraMax) : 0;
    const preparo = j.contraAtaque ? d.preparo * 0.5 : d.preparo;
    if (j.contraAtaque) { if (j.escudo) Escudo.terminar(false); j.fimEscudo = -9; }
    j.cargaExplosao = preparo; j.preparoExplosao = preparo;
    j.recargaExplosao = j.recargaExplosaoTotal = d.recarga + d.preparo;
    Som.tocar('cargaExplosao'); vibrar(10);
  },
  atualizar(dt) {
    const j = Jogo.jogador;
    j.recargaExplosao = Math.max(0, j.recargaExplosao - dt);
    if (j.cargaExplosao > 0) {
      const d = this.dados();
      j.cargaExplosao -= dt;
      j.z = lerp(j.z, 10, 1 - Math.exp(-8 * dt));
      if (Math.random() < dt * 60) {
        const a = Math.random() * Math.PI * 2, r = (d ? d.raio : 120) * (0.7 + Math.random() * 0.5);
        Efeitos.particula(j.x + Math.cos(a) * r, j.y + Math.sin(a) * r, 6 + Math.random() * 30, { segue: true, atraso: 0, cor: Math.random() < 0.5 ? '#B57BFF' : '#F3E4FF', vida: 0.4, tam: 2, aditivo: true, forma: Visual.forma() });
      }
      Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 1.5);
      if (j.cargaExplosao <= 0) { j.cargaExplosao = 0; if (d) { this.liberar(d, 1); if (d.ondas > 1) j.segundaOnda = 0.3; } }
    } else if (j.z > 0 && !Cena.atual) j.z = Math.max(0, j.z - dt * 80);
    if (j.segundaOnda > 0) { j.segundaOnda -= dt; if (j.segundaOnda <= 0) { const d = this.dados(); if (d) this.liberar(d, 2); } }
    for (let i = Jogo.explosoes.length - 1; i >= 0; i--) {
      const ex = Jogo.explosoes[i];
      ex.t += dt;
      if (ex.r < ex.rMax && ex.soVisual) ex.r = Math.min(ex.rMax, ex.r + ex.vel * dt);
      else if (ex.r < ex.rMax) {
        ex.r = Math.min(ex.rMax, ex.r + ex.vel * dt);
        for (const e of Jogo.inimigos) {
          if (!alvejavel(e) || ex.acertados.has(e.id)) continue;
          if (distancia(ex, e) - e.raio <= ex.r) { ex.acertados.add(e.id); this.atingir(ex, e); }
        }
        for (let k = Jogo.projeteisInimigos.length - 1; k >= 0; k--) {
          const p = Jogo.projeteisInimigos[k];
          if (!p.refletido && distancia(ex, p) <= ex.r) { Jogo.projeteisInimigos.splice(k, 1); Efeitos.faiscas(p.x, p.y, 30, 6, '#E2C8FF'); }
        }
        for (const o of Jogo.objetos) {
          if (o.estado !== 'chao' || o.def.peso > 3 || ex.acertados.has('o' + o.id)) continue;
          if (distancia(ex, o) <= ex.r) {
            ex.acertados.add('o' + o.id);
            const n = normalizar(o.x - ex.x, o.y - ex.y), v = (ex.forca * 0.9) / o.def.peso;
            Object.assign(o, { estado: 'voando', vx: n.x * v, vy: n.y * v, vz: 180, vrot: 10, lancado: true, doJogador: false, acertou: new Set() });
          }
        }
      }
      if (ex.t > 0.9) Jogo.explosoes.splice(i, 1);
    }
    for (let i = Jogo.rachaduras.length - 1; i >= 0; i--) { Jogo.rachaduras[i].t += dt; if (Jogo.rachaduras[i].t > 1.6) Jogo.rachaduras.splice(i, 1); }
  },
  liberar(d, onda) {
    const j = Jogo.jogador, nv = j.explosaoNivel || 1;
    const contra = j.contraAtaque || 0;
    const dano = Math.round((onda === 2 ? d.dano * 0.5 : d.dano) * (contra || 1));
    const rMax = d.raio * (onda === 2 ? 1.15 : 1) * (contra ? 1.15 : 1);
    const acertados = new Set();
    if (onda === 1) Gravidade.implodir(dano, d.forca, d.atordoa, acertados);
    Jogo.explosoes.push({ x: j.x, y: j.y, r: 0, rMax, vel: rMax / 0.26, dano, forca: d.forca * (onda === 2 ? 0.7 : 1), atordoa: d.atordoa, acertados, t: 0, nivel: nv, onda, contra: !!contra });
    if (contra && onda === 1) { Efeitos.texto(j.x, j.y, 96, 'Contra-ataque!', '#FFE08A'); Som.tocar('contra'); Jogo.stats.contraAtaques++; Fluxo.evento('contra'); }
    if (onda === 2 || d.ondas === 1) j.contraAtaque = 0;
    j.z = 0; j.poseTk = 0.4;

  // nível 1: um alvo (prefere quem está preparando um ataque); níveis 2 e 3: o ponto que pega mais inimigos

    }
    const cands = Jogo.inimigos.filter((e) => alvejavel(e) && distancia(j, e) <= d.alcance);
    if (!cands.length) return { alvo: null, ponto: { x: j.x + j.olhar.x * 150, y: j.y + j.olhar.y * 150 } };
    if (d.raio < 80) {
      const nota = (e) => distancia(j, e) - (/prepar|investi/i.test(e.estado) ? 220 : 0) + (e.imuneGrav > 0 ? 400 : 0) + (this.pesado(e) ? 120 : 0);

/* ========== 12. INIMIGOS ========== */
// Desvio simples: olha um pouco à frente e contorna colunas, árvores e objetos no caminho
function desviarObstaculos(e, dir, incluirObjetos = true) {
  let ax = 0, ay = 0;
  const alcance = 70;
  const verificar = (o, r) => {
    const dx = o.x - e.x, dy = o.y - e.y;
    const frente = dx * dir.x + dy * dir.y;
    if (frente <= 0 || frente > alcance + r) return;
    const lado = dx * -dir.y + dy * dir.x, folga = e.raio + r + 8;
    if (Math.abs(lado) > folga) return;
    const peso = (1 - frente / (alcance + r)) * (1.3 - Math.abs(lado) / folga);
    const s = lado > 1 ? -1 : lado < -1 ? 1 : (e.id % 2 ? 1 : -1);
    ax += -dir.y * s * peso; ay += dir.x * s * peso;
  };
  for (const s of Mundo.estaticos) verificar(s, s.raio);
  for (const s of Ilusao.obstaculos(e)) verificar(s, s.raio);
  if (incluirObjetos) for (const o of Jogo.objetos) if (o.estado === 'chao') verificar(o, o.raio);
  if (e.contorno > 0) { ax += -dir.y * e.ladoContorno * 1.4; ay += dir.x * e.ladoContorno * 1.4; }
  return normalizar(dir.x + ax * 1.8, dir.y + ay * 1.8);
}
// Se ficar parado tentando andar, escolhe um lado e contorna por um tempo
function verificarTravado(e, ox, oy, velEsperada, dt) {
  e.contorno = Math.max(0, (e.contorno || 0) - dt);
  const andou = Math.hypot(e.x - ox, e.y - oy);
  if (velEsperada > 0 && andou < velEsperada * dt * 0.3) e.travado = (e.travado || 0) + dt;
  else e.travado = Math.max(0, (e.travado || 0) - dt);
  if (e.travado > 0.45) { e.travado = 0; e.contorno = 0.9; e.ladoContorno = Math.random() < 0.5 ? -1 : 1; }
}
// Movimento comum a quase todos os inimigos
function moverInimigo(e, mvx, mvy, dt, fixo = false, suave = 10) {
  if (fixo) { e.vx = mvx; e.vy = mvy; } else { const k = 1 - Math.exp(-suave * dt); e.vx += (mvx - e.vx) * k; e.vy += (mvy - e.vy) * k; }
  const ox = e.x, oy = e.y;
  e.x += (e.vx + e.kx) * dt; e.y += (e.vy + e.ky) * dt;
  const kk = Math.exp(-6 * dt); e.kx *= kk; e.ky *= kk;
  let bateu = null;
  if (e.estado !== 'morrendo') { bateu = resolverEstaticos(e); if (!e.leve) resolverObjetosChao(e); bateu = limitar(e) || bateu; }
  return { ox, oy, bateu };
}
// Ponto livre a certa distância (para quem some e reaparece)
function pontoLivre(cx, cy, dist) {
  const W = CONFIG.mundo.largura, H = CONFIG.mundo.altura;
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, d = dist * (0.85 + Math.random() * 0.3);
    const p = { x: clamp(cx + Math.cos(a) * d, 120, W - 120), y: clamp(cy + Math.sin(a) * d, 130, H - 120), raio: 22 };
    if (!tocaEstatico(p) && Math.hypot(p.x - cx, p.y - cy) > dist * 0.6) return p;
  }
  return { x: clamp(cx + dist, 120, W - 120), y: clamp(cy, 130, H - 120), raio: 22 };
}
function soltarEnxame(x, y, n) {
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2, c = novoInimigo('cinza', x + Math.cos(a) * 26, y + Math.sin(a) * 20);

function atualizarVulto(e, dt) {
  const j = Jogo.jogador, d = e.def;
  let mvx = 0, mvy = 0;
  const dx = j.x - e.x, dy = j.y - e.y, dj = Math.hypot(dx, dy) || 1;

      break;

      if (!j.morto) {
        e.dir = { x: dx / dj, y: dy / dj };
        const rumo = desviarObstaculos(e, e.dir);
        mvx = rumo.x * d.velocidade; mvy = rumo.y * d.velocidade;
      }
      if (!j.morto && dj < d.alcanceAtaque && e.t > 0.3) { e.estado = 'preparar'; e.t = 0; e.dir = { x: dx / dj, y: dy / dj }; Som.tocar('vultoAtaque'); }

      if (Math.random() < dt * 40) Efeitos.particula(e.x, e.y, 16, { cor: 'rgba(40,32,72,0.8)', vida: 0.35, tam: 7 });
      if (e.t > d.investida) { e.estado = 'recuperar'; e.t = 0; }
      break;
    case 'recuperar':
      if (e.t > d.recuperacao) { e.estado = 'perseguir'; e.t = 0; }

}
function atualizarInimigos(dt) {
  for (let i = Jogo.inimigos.length - 1; i >= 0; i--) {
    const e = Jogo.inimigos[i];
    if (!e) continue;
    const f = e.lentoGrav > 0 ? e.fatorGrav : 1, dtE = dt * f;
    e.t += dtE; e.flash -= dt; e.reacao = Math.max(0, e.reacao - dt); e.flashEscudo = Math.max(0, (e.flashEscudo || 0) - dt);
    e.lentoGrav = Math.max(0, (e.lentoGrav || 0) - dt); e.imuneGrav = Math.max(0, (e.imuneGrav || 0) - dt);
    if (e.estado === 'morrendo') { e.x += e.kx * dt; e.y += e.ky * dt; const kk = Math.exp(-6 * dt); e.kx *= kk; e.ky *= kk; }
    else if (e.estado === 'suspenso') Gravidade.flutuar(e, dt);
    else if (e.estado === 'tk') TK.flutuarInimigo(e, dt);
    else if (e.estado === 'arremessado') TK.vooInimigo(e, dt);
    else if (e.estado === 'prisaoTk') TK.atualizarPreso(e, dt);
    else Ilusao.atualizarIA(e, dtE);
    if (e.estado !== 'suspenso' && e.estado !== 'tk' && e.estado !== 'arremessado' && e.elev > 0) e.elev = Math.max(0, e.elev - dt * 300);
    if (e.estado === 'morrendo' && e.t > 0.7) { const k = Jogo.inimigos.indexOf(e); if (k >= 0) Jogo.inimigos.splice(k, 1); }
  }
  const lista = Jogo.inimigos;
  for (let a = 0; a < lista.length; a++) for (let b = a + 1; b < lista.length; b++) {
    const A = lista[a], B = lista[b];
    if (A.estado === 'morrendo' || B.estado === 'morrendo' || A.intocavel || B.intocavel) continue;
    const r = A.raio + B.raio, dx = B.x - A.x, dy = B.y - A.y, d2 = dx * dx + dy * dy;

    }

// Ônix, o Guardião das Ruínas: armadura bloqueia a Rajada; a telecinese o abala e expõe o núcleo.

        e.anim += dt * 4;
        e.prox -= dt;
        if (e.prox <= 0 && !j.morto) this.escolherAtaque(e, dj);
        break;
      }
      case 'preparoSlam':
        if (e.t > e.preparoAtual) {
          e.estado = 'recuperar'; e.t = 0; e.ultimoAtaque = 'slam';
          Som.tocar('slam'); vibrar(40);
          Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 12);
          Jogo.ondasFx.push({ x: e.x, y: e.y, dir: { x: 1, y: 0 }, alcance: d.slam.raio, abertura: Math.PI, t: 0, cor: '255,138,77' });
          Efeitos.poeira(e.x, e.y, 14);
          if (distancia(j, e) < d.slam.raio + j.raio) Combate.danoJogador(d.slam.dano, normalizar(j.x - e.x, j.y - e.y));
          for (const o of Jogo.objetos) {
            if (o.estado !== 'chao' || o.def.peso > 3 || distancia(o, e) > d.slam.raio + 40) continue;
            const n = normalizar(o.x - e.x, o.y - e.y);
            o.estado = 'voando'; o.vx = n.x * 380; o.vy = n.y * 380; o.vz = 260; o.vrot = 9; o.lancado = false; o.doJogador = false; o.acertou = new Set();
          }
        }
        break;
      case 'preparoEstilhacos':
        if (e.t < e.preparoAtual * 0.5 && !j.morto) {
          e.dir = { x: dx / dj, y: dy / dj };
          const q = furia ? d.estilhacos.qtdFuria : d.estilhacos.qtd;
          e.dirs = Array.from({ length: q }, (_, k) => girar(e.dir, (k / (q - 1) - 0.5) * d.estilhacos.abertura * (furia ? 1.5 : 1)));
        }
        if (e.t > e.preparoAtual) {
          e.estado = 'recuperar'; e.t = 0.2; e.ultimoAtaque = 'estilhacos';
          for (const v of e.dirs) Jogo.projeteisInimigos.push({ tipo: 'estilhaco', x: e.x + v.x * 30, y: e.y + v.y * 24, z: 60, vx: v.x * d.estilhacos.velocidade, vy: v.y * d.estilhacos.velocidade, raio: 7, dano: d.estilhacos.dano, dist: 0, alcance: d.estilhacos.alcance, t: 0, esquivado: false, dono: e });
          Som.tocar('estilhaco');
        }
        break;
      case 'preparoInvestida':
        if (e.t < e.preparoAtual * 0.55 && !j.morto) e.dir = normalizar(lerp(e.dir.x, dx / dj, 0.2), lerp(e.dir.y, dy / dj, 0.2));
        if (e.t > e.preparoAtual) { e.estado = 'investida'; e.t = 0; e.acertou = false; Som.tocar('chefeRugido'); }
        break;
      case 'investida': {
        mvx = e.dir.x * d.investida.velocidade; mvy = e.dir.y * d.investida.velocidade; velFixa = true;
        if (!e.acertou && !j.morto && dj < e.raio + j.raio + 8) { e.acertou = true; Combate.danoJogador(d.investida.dano, e.dir, { atacante: e }); }
        if (Math.random() < dt * 30) Efeitos.poeira(e.x, e.y, 2);
        if (e.t > d.investida.duracao) { e.estado = 'recuperar'; e.t = 0; e.ultimoAtaque = 'investida'; }
        break;
      }
      case 'recuperar':
        if (e.t > (e.ultimoAtaque === 'slam' ? 0.9 : 0.7)) { e.estado = 'andar'; e.t = 0; e.prox = furia ? d.intervaloFuria : d.intervalo; }
        break;
      case 'abalado':
        if (Math.random() < dt * 6) Efeitos.particula(e.x + (Math.random() - 0.5) * 30, e.y, 90, { vz: 40, cor: '#FFB27A', vida: 0.6, tam: 2, aditivo: true });
        if (e.t > d.abalo.duracao) { e.estado = 'levantar'; e.t = 0; }
        break;
      case 'levantar':
        if (e.t > 0.6) { e.estado = 'andar'; e.t = 0; e.prox = 0.8; e.abalo = 0; }
        break;
      case 'furia':
        if (e.t > 0.5 && !e.furiaOnda) {
          e.furiaOnda = true;
          Jogo.ondasFx.push({ x: e.x, y: e.y, dir: { x: 1, y: 0 }, alcance: 220, abertura: Math.PI, t: 0, cor: '255,90,61' });
          Jogo.cam.tremor = 14; Som.tocar('slam');
          if (distancia(j, e) < 230) { const n = normalizar(j.x - e.x, j.y - e.y); j.kx = n.x * 700; j.ky = n.y * 700; }
          const pontos = MAPA.surgimento.slice().sort((a, b) => Math.hypot(a[0] - e.x, a[1] - e.y) - Math.hypot(b[0] - e.x, b[1] - e.y));
          for (let k = 0; k < 2; k++) Jogo.inimigos.push(novoInimigo(Fluxo.etapa === 'arena' ? 'couraca' : 'vulto', pontos[k + 1][0], pontos[k + 1][1]));
        }
        if (e.t > 1.5) { e.estado = 'andar'; e.t = 0; e.prox = 0.6; }
        break;
      case 'derrotado':
        if (Math.random() < dt * 30) Efeitos.particula(e.x + (Math.random() - 0.5) * 60, e.y + (Math.random() - 0.5) * 20, 20 + Math.random() * 80, { vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 60, vz: 60 + Math.random() * 120, cor: Math.random() < 0.5 ? '#3A3546' : '#5A5468', vida: 0.9, tam: 3 + Math.random() * 3, gravidade: true, quadrado: true });
        break;
    }
    if (velFixa) { e.vx = mvx; e.vy = mvy; }
    else { const k = 1 - Math.exp(-6 * dt); e.vx += (mvx - e.vx) * k; e.vy += (mvy - e.vy) * k; }
    const ox = e.x, oy = e.y;
    e.x += (e.vx + e.kx) * dt; e.y += (e.vy + e.ky) * dt;
    const kk = Math.exp(-5 * dt); e.kx *= kk; e.ky *= kk;
    if (['despertando', 'derrotado'].includes(e.estado)) return;
    // chuta objetos leves e só para em paredes, colunas e árvores
    for (const o of Jogo.objetos) {
      if (o.estado !== 'chao' || o.def.peso > 3) continue;
      if (dist2(o, e) < (o.raio + e.raio) ** 2) {
        const n = normalizar(o.x - e.x, o.y - e.y), v = 200 + Math.hypot(e.vx, e.vy);
        o.estado = 'voando'; o.vx = n.x * v; o.vy = n.y * v; o.vz = 140; o.vrot = 6; o.lancado = false; o.doJogador = false; o.acertou = new Set();
      }
    }
    const n1 = resolverEstaticos(e), n2 = limitar(e);
    const bateu = n1 || n2;
    if (e.estado === 'andar') verificarTravado(e, ox, oy, furia ? d.velocidadeFuria : d.velocidade, dt);
    if (e.estado === 'investida' && bateu) {
      e.vx = 0; e.vy = 0;
      Efeitos.texto(e.x, e.y, 120, 'Ele se chocou!', '#FFB27A');
      Som.tocar('choque'); vibrar([50, 30, 50]);
      Jogo.cam.tremor = 16; Efeitos.poeira(e.x, e.y, 16);
      this.abalar(e);
    }
    // o jogador não atravessa o chefe
    if (!j.morto && dj < j.raio + e.raio) { const p = j.raio + e.raio - dj; j.x -= (dx / dj) * -p; j.y -= (dy / dj) * -p; }
  },
  escolherAtaque(e, dj) {
    const d = e.def, furia = e.fase === 2, f = furia ? 0.8 : 1;
    let ataque;
    if (dj < 165) ataque = 'preparoSlam';
    else if (dj > 280 && Math.random() < (furia ? 0.5 : 0.4)) ataque = 'preparoInvestida';
    else ataque = 'preparoEstilhacos';
    e.estado = ataque; e.t = 0; e.vx *= 0.2; e.vy *= 0.2;
    e.preparoAtual = (ataque === 'preparoSlam' ? d.slam.preparo : ataque === 'preparoInvestida' ? d.investida.preparo : d.estilhacos.preparo) * f;
    if (ataque === 'preparoSlam') Som.tocar('chefeRugido');
  },
  abalar(e) {
    const d = e.def;
    e.estado = 'abalado'; e.t = 0; e.abalo = d.abalo.limite; e.semAbalo = 0;
    Jogo.stats.abalos++;
    Som.tocar('combo'); vibrar(30);
    Hud.anunciar('', 'Núcleo exposto!', `“${d.falas.abalo}”`, 'chefe', 1.6);
    if (e.primeiroAbalo) { e.primeiroAbalo = false; Hud.aviso('O núcleo está exposto! Agora a Rajada causa dano crítico.', false); }
    Progressao.ganharXp(d.xpAbalo, e.x, e.y);
  },
  receber(e, dano, dir, forca, op) {
    const d = e.def;
    if (['despertando', 'furia', 'derrotado'].includes(e.estado)) { Efeitos.texto(e.x, e.y, 110, 'imune', '#A69CC0'); return; }
    const exposto = e.estado === 'abalado';
    let final = dano, rotulo = null, cor = '#FFE1A8';
    if (exposto) {
      if (op.fonte === 'rajada') { final = Math.round(dano * 1.6); rotulo = 'Crítico!'; cor = '#FFB27A'; }
    } else {
      e.semAbalo = 0;
      if (op.fonte === 'rajada') { final = Math.max(1, Math.round(dano * 0.25)); rotulo = 'Bloqueado'; cor = '#B8B2C8'; e.abalo += d.abalo.rajada; Som.tocar('bloqueado'); }
      else if (op.fonte === 'objeto') { final = Math.round(dano * 0.5); e.abalo += d.abalo.objeto; }
      else if (op.fonte === 'empurrar') { final = 2; e.abalo += d.abalo.empurrar; }
      else if (op.fonte === 'explosao') { final = Math.round(dano * 0.6); e.abalo += 30; rotulo = 'Abalado!'; cor = '#FFE08A'; }
      else if (op.fonte === 'reflexo') { e.abalo += 16; rotulo = 'Reflexo!'; cor = '#C9C6FF'; }
    }
    e.vida -= final; e.flash = 0.12; e.reacao = 0.2;
    e.kx += dir.x * forca * 0.12; e.ky += dir.y * forca * 0.12;
    Efeitos.texto(e.x, e.y, 112, String(final), cor);
    if (rotulo) Efeitos.texto(e.x, e.y, 132, rotulo, cor);
    Efeitos.faiscas(e.x, e.y, 60, 10, rotulo === 'Bloqueado' ? '#D8D2E6' : '#FFB27A');
    Jogo.hitstop = Math.max(Jogo.hitstop, 0.04); Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 4);
    Som.tocar('chefeDano');
    if (e.vida <= 0) { e.vida = 0; this.derrotar(e); return; }
    if (e.fase === 1 && e.vida <= d.vida * 0.5) {
      e.fase = 2; e.estado = 'furia'; e.t = 0; e.furiaOnda = false; e.abalo = 0;
      Som.tocar('chefeRugido');
      Hud.anunciar('Fúria', d.nome, `“${d.falas.furia}”`, 'chefe', 2.2);
      return;
    }
    if (!exposto && e.abalo >= d.abalo.limite) this.abalar(e);
  },
  derrotar(e) {
    e.estado = 'derrotado'; e.t = 0;
    for (const v of Jogo.inimigos) if (v !== e && v.estado !== 'morrendo') { v.estado = 'morrendo'; v.t = 0; }
    Jogo.projeteisInimigos = [];
    Cena.iniciar('chefeDerrota', { chefe: e });
  },
  // desenhos no chão que anunciam cada ataque
  telegrafar(c, e) {
    const K = CONFIG.K, d = e.def;
    if (e.estado === 'preparoSlam') {
      const p = clamp(e.t / e.preparoAtual, 0, 1);
      c.save(); c.translate(e.x, e.y * K); c.scale(1, K);
      c.fillStyle = 'rgba(255,138,77,0.12)'; circulo(c, 0, 0, d.slam.raio); c.fill();
      c.fillStyle = 'rgba(255,138,77,0.3)'; circulo(c, 0, 0, d.slam.raio * p); c.fill();
      c.strokeStyle = 'rgba(255,160,110,0.85)'; c.lineWidth = 2.5; circulo(c, 0, 0, d.slam.raio); c.stroke();
      c.restore();
    } else if (e.estado === 'preparoInvestida') {
      const L = d.investida.velocidade * d.investida.duracao, p = clamp(e.t / e.preparoAtual, 0, 1);
      c.save(); c.translate(e.x, e.y * K); c.scale(1, K); c.rotate(Math.atan2(e.dir.y, e.dir.x));
      c.fillStyle = 'rgba(255,138,77,0.12)'; rr(c, 0, -e.raio, L, e.raio * 2, e.raio); c.fill();
      c.fillStyle = 'rgba(255,138,77,0.32)'; rr(c, 0, -e.raio, L * p, e.raio * 2, e.raio); c.fill();
      c.strokeStyle = 'rgba(255,160,110,0.85)'; c.lineWidth = 2.5; rr(c, 0, -e.raio, L, e.raio * 2, e.raio); c.stroke();
      c.restore();
    } else if (e.estado === 'preparoEstilhacos') {
      c.save(); c.setLineDash([8, 8]); c.strokeStyle = `rgba(255,150,100,${0.35 + clamp(e.t / e.preparoAtual, 0, 1) * 0.5})`; c.lineWidth = 2;
      for (const v of e.dirs) { c.beginPath(); c.moveTo(e.x + v.x * 30, (e.y + v.y * 30) * K); c.lineTo(e.x + v.x * 330, (e.y + v.y * 330) * K); c.stroke(); }
      c.restore();
    }
  },
};

// Arauto (comum): mantém distância, dispara rajadas de três orbes e some quando você chega perto
const Arauto = {
  atualizar(e, dt) {
    const j = Jogo.jogador, d = e.def;
    const dx = j.x - e.x, dy = j.y - e.y, dj = Math.hypot(dx, dy) || 1;
    let mvx = 0, mvy = 0;
    e.recargaPiscar = Math.max(0, e.recargaPiscar - dt);
    e.anim += dt;
    switch (e.estado) {
      case 'surgindo': if (e.t > 0.8) { e.estado = 'posicionar'; e.t = 0; } break;
      case 'posicionar': {
        if (j.morto) break;
        e.dir = { x: dx / dj, y: dy / dj };
        if (dj < d.distFuga && e.recargaPiscar <= 0) { e.estado = 'sumir'; e.t = 0; Som.tocar('piscar'); break; }
        let rx = -e.dir.y * e.lado * 0.8, ry = e.dir.x * e.lado * 0.8;
        if (dj > d.distIdeal + 60) { rx += e.dir.x; ry += e.dir.y; } else if (dj < d.distIdeal - 60) { rx -= e.dir.x * 1.2; ry -= e.dir.y * 1.2; }
        const rumo = desviarObstaculos(e, normalizar(rx, ry));
        mvx = rumo.x * d.velocidade; mvy = rumo.y * d.velocidade;
        if (Math.random() < dt * 0.35) e.lado = -e.lado;
        e.prox -= dt;
        if (e.prox <= 0 && dj < 600) { e.estado = 'preparar'; e.t = 0; e.mira = { ...e.dir }; Som.tocar('arautoCarga'); }
        break;
      }
      case 'preparar':
        if (e.t < d.preparo * 0.7 && !j.morto) e.mira = { x: dx / dj, y: dy / dj };
        if (e.t > d.preparo) { e.estado = 'disparar'; e.t = 0; e.tiros = d.tiros; e.proxTiro = 0; }
        break;
      case 'disparar':
        e.proxTiro -= dt;
        if (e.tiros > 0 && e.proxTiro <= 0) { this.tiro(e); e.tiros--; e.proxTiro = d.intervaloTiro; }
        if (e.tiros <= 0 && e.proxTiro <= 0) { e.estado = 'posicionar'; e.t = 0; e.prox = d.recarga * (0.8 + Math.random() * 0.5); }
        break;
      case 'sumir':
        e.intocavel = e.t > 0.12;
        if (e.t > 0.3) { const p = pontoLivre(j.x, j.y, d.distIdeal); e.x = p.x; e.y = p.y; e.vx = 0; e.vy = 0; e.estado = 'surgir'; e.t = 0; }
        break;
      case 'surgir':
        if (e.t > 0.3) { e.intocavel = false; e.estado = 'posicionar'; e.t = 0; e.prox = Math.min(e.prox, 0.7); e.recargaPiscar = d.recargaPiscar; }
        break;
      case 'atordoado':
        if (e.t > e.atordoTempo) { e.estado = 'posicionar'; e.t = 0; e.derrubado = false; e.prox = Math.max(e.prox, 0.7); }
        break;
    }
    const r = moverInimigo(e, mvx, mvy, dt);
    verificarTravado(e, r.ox, r.oy, e.estado === 'posicionar' ? d.velocidade : 0, dt);
  },
  tiro(e) {
    const d = e.def, v = girar(e.mira, (Math.random() - 0.5) * 0.12);
    Jogo.projeteisInimigos.push({ tipo: 'orbe', x: e.x + v.x * 16, y: e.y + v.y * 12, z: 34, vx: v.x * d.velTiro, vy: v.y * d.velTiro, raio: 6, dano: d.danoTiro, dist: 0, alcance: 640, t: 0, dono: e });
    Som.tocar('arautoTiro');
  },
};

// Couraça (comum): escudo de pedra na frente, vira devagar; golpeia com o escudo
const Couraca = {
  atualizar(e, dt) {
    const j = Jogo.jogador, d = e.def;
    const dx = j.x - e.x, dy = j.y - e.y, dj = Math.hypot(dx, dy) || 1;
    let mvx = 0, mvy = 0, fixo = false;
    if (!['atordoado', 'golpe', 'surgindo'].includes(e.estado) && !j.morto) {
      const alvo = Math.atan2(dy, dx), atual = Math.atan2(e.face.y, e.face.x);
      let da = alvo - atual; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
      const giro = d.giro * (e.estado === 'preparar' ? 0.35 : 1);
      const na = atual + clamp(da, -giro * dt, giro * dt);
      e.face = { x: Math.cos(na), y: Math.sin(na) };
    }
    e.anim += dt;
    switch (e.estado) {
      case 'surgindo': if (e.t > 0.8) { e.estado = 'avancar'; e.t = 0; } break;
      case 'avancar': {
        if (j.morto) break;
        const rumo = desviarObstaculos(e, { x: dx / dj, y: dy / dj });
        mvx = rumo.x * d.velocidade; mvy = rumo.y * d.velocidade;
        const mirando = (dx * e.face.x + dy * e.face.y) / dj > 0.88;
        if (dj < d.alcanceGolpe + j.raio && mirando && e.t > 0.4) { e.estado = 'preparar'; e.t = 0; Som.tocar('vultoAtaque'); }
        break;
      }
      case 'preparar':
        if (e.t > d.preparo) { e.estado = 'golpe'; e.t = 0; e.acertou = false; e.dir = { ...e.face }; Som.tocar('couracaGolpe'); }
        break;
      case 'golpe':
        mvx = e.dir.x * d.velGolpe; mvy = e.dir.y * d.velGolpe; fixo = true;
        if (!e.acertou && !j.morto && dj < e.raio + j.raio + 10) {
          e.acertou = true;
          if (Combate.danoJogador(d.dano, e.dir, { atacante: e }) === 'dano') { j.kx = e.dir.x * 620; j.ky = e.dir.y * 620; }
        }
        if (e.t > d.duracaoGolpe) { e.estado = 'recuperar'; e.t = 0; }
        break;
      case 'recuperar': if (e.t > d.recuperacao) { e.estado = 'avancar'; e.t = 0; } break;
      case 'atordoado': if (e.t > e.atordoTempo) { e.estado = 'avancar'; e.t = 0.2; e.derrubado = false; } break;
    }
    const r = moverInimigo(e, mvx, mvy, dt, fixo, 8);
    verificarTravado(e, r.ox, r.oy, e.estado === 'avancar' ? d.velocidade : 0, dt);
  },
  frontal(e, dir) { return (-dir.x * e.face.x - dir.y * e.face.y) > Math.cos(e.def.guardaAngulo); },
  receber(e, dano, dir, forca, atordoar, op) {
    const guarda = e.estado !== 'atordoado' && e.estado !== 'suspenso';
    if (guarda && this.frontal(e, dir) && op.fonte !== 'explosao' && op.fonte !== 'escudo') {
      if (op.fonte === 'objeto' || op.fonte === 'empurrar') {
        Combate.aplicarDano(e, op.fonte === 'objeto' ? Math.round(dano * 0.35) : 0, dir, forca * 0.6, 1.1, { rotulo: 'Guarda aberta!', cor: '#FFE08A', fonte: op.fonte });
        Fluxo.evento('guardaAberta');
        return;
      }
      e.flashEscudo = 0.18; e.kx += dir.x * 80; e.ky += dir.y * 80;
      Efeitos.texto(e.x, e.y, 60, 'Bloqueado', '#B8B2C8');
      Efeitos.faiscas(e.x + e.face.x * 20, e.y + e.face.y * 14, 30, 10, '#D8D2E6');
      Som.tocar('bloqueado'); Fluxo.evento('couracaBloqueou');
      return;
    }
    let final = dano, rotulo = op.rotulo, cor = op.cor;
    if (guarda && op.fonte === 'rajada' && !rotulo) { final = Math.round(dano * 1.25); rotulo = 'Flanco!'; cor = '#FFE08A'; }
    Combate.aplicarDano(e, final, dir, forca, atordoar, { ...op, rotulo, cor });
  },
};

// Cinzas (comum): bando que gira ao redor do jogador e dá botes rápidos
const Cinza = {
  atualizar(e, dt) {
    const j = Jogo.jogador, d = e.def;
    const dx = j.x - e.x, dy = j.y - e.y, dj = Math.hypot(dx, dy) || 1;
    let mvx = 0, mvy = 0, fixo = false;
    e.anim += dt;
    switch (e.estado) {
      case 'surgindo': if (e.t > 0.5) { e.estado = 'orbitar'; e.t = 0; } break;
      case 'orbitar': {
        if (j.morto) break;
        e.ang += e.velAng * dt;

      const F = d.feixes, j = Jogo.jogador, base = Math.atan2(j.y - e.y, j.x - e.x) + Math.PI / F.qtd;
      c.save(); c.setLineDash([10, 10]); c.strokeStyle = `rgba(190,215,255,${(0.3 + clamp(e.t / F.preparo, 0, 1) * 0.5).toFixed(3)})`; c.lineWidth = 2;
      for (let k = 0; k < F.qtd; k++) { const a = base + (k / F.qtd) * Math.PI * 2; c.beginPath(); c.moveTo(e.x, e.y * K); c.lineTo(e.x + Math.cos(a) * F.comprimento, (e.y + Math.sin(a) * F.comprimento) * K); c.stroke(); }
