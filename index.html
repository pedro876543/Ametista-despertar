// Reações dos inimigos já existentes ao Campo Gravitacional
Chefe.gravidade = function (e) {
  if (['preparoSlam', 'preparoEstilhacos', 'preparoInvestida', 'investida'].includes(e.estado)) {
    e.estado = 'recuperar'; e.t = 0; e.ultimoAtaque = 'slam'; e.vx = 0; e.vy = 0; e.imuneGrav = 5;
    Efeitos.texto(e.x, e.y, 130, 'Interrompido!', '#FFE08A'); Som.tocar('queda'); Fluxo.evento('interrompeu');
  } else { Efeitos.texto(e.x, e.y, 130, 'Pesado demais · lento', '#B8B2C8'); e.imuneGrav = 2; }
};
Vesper.gravidade = function (e, campo) {
  for (const eco of Vesper.ecos(e)) if (distancia(eco, campo) < campo.raio + 60) Vesper.dissolver(eco, false);
  if (['chegada', 'furia', 'derrotado', 'sumir', 'surgir'].includes(e.estado)) return;
  if (distancia(e, campo) > campo.raio + e.raio + 10) return;
  e.estado = 'revelada'; e.t = 0; e.imuneGrav = 6;
  Efeitos.texto(e.x, e.y, 100, 'Revelada!', '#FFE08A');
};
Eco.gravidade = function (e) { Vesper.dissolver(e, true); };
Soberano.gravidade = function (e) {
  if (['orbes', 'leque', 'lancas', 'ondaPreparo', 'deslizar'].includes(e.estado)) {
    e.estado = 'cansado'; e.t = Math.max(0, e.def.onda.cansado - 1.4); e.alvoZ = 0; e.imuneGrav = 6;
    Efeitos.texto(e.x, e.y, 140, 'Interrompido!', '#FFE08A'); Som.tocar('queda'); Fluxo.evento('interrompeu');
  } else { Efeitos.texto(e.x, e.y, 140, 'Pesado demais', '#B8B2C8'); e.imuneGrav = 2; }
};
const IA = { vulto: { atualizar: atualizarVulto }, arauto: Arauto, couraca: Couraca, cinza: Cinza, eco: Eco, vesper: Vesper, onix: Chefe, soberano: Soberano, ilusionista: Ilusionista, espelho: Espelho, tempestade: Tempestade, colosso: Colosso, guardiao: Guardiao };

// Áreas que explodem no chão (lanças e meteoros), anéis de choque e o clima da última etapa
function atualizarPerigos(dt) {
  const j = Jogo.jogador;
  for (let i = Jogo.perigos.length - 1; i >= 0; i--) {
    const p = Jogo.perigos[i];
    p.t += dt;
    if (!p.estourou && p.t >= p.preparo) {
      p.estourou = true;
      if (p.tipo === 'raio') { Som.tocar('descarga'); Jogo.ambiente.relampago = Math.max(Jogo.ambiente.relampago, 0.25); Efeitos.faiscas(p.x, p.y, 10, 14, '#FFF2A8'); }
      else if (p.tipo === 'pedra') {
        Som.tocar('quebraPedra'); Efeitos.poeira(p.x, p.y, 10);
        if (Jogo.objetos.length < 34 && !tocaEstatico({ x: p.x, y: p.y, raio: 16 })) Jogo.objetos.push(novoObjeto('pedra', p.x, p.y));
      } else Som.tocar('lanca');
      Jogo.cam.tremor = Math.max(Jogo.cam.tremor, p.tipo === 'meteoro' || p.tipo === 'pedra' ? 6 : 4);
      Efeitos.faiscas(p.x, p.y, 10, 12, p.tipo === 'raio' ? '#FFF2A8' : '#FFB27A'); Efeitos.poeira(p.x, p.y, 6);
      if (!j.morto && distancia(j, p) < p.raio + j.raio * 0.6) Combate.danoJogador(p.dano, normalizar(j.x - p.x, j.y - p.y));
    }
    if (p.t > p.preparo + 0.55) Jogo.perigos.splice(i, 1);
  }
  for (let i = Jogo.aneis.length - 1; i >= 0; i--) {
    const a = Jogo.aneis[i];
    a.t += dt; a.r += a.vel * dt;
    if (!a.acertou && !j.morto && Math.abs(distancia(j, a) - a.r) < a.esp / 2 + j.raio * 0.5) {
      const ang = Math.atan2(j.y - a.y, j.x - a.x);
      const livre = a.aberturas && a.aberturas.some((g) => Math.abs(Math.atan2(Math.sin(ang - g.a), Math.cos(ang - g.a))) < g.larg / 2);
      if (!livre) { a.acertou = true; Combate.danoJogador(a.dano, normalizar(j.x - a.x, j.y - a.y)); }
      else if (!a.passou) { a.passou = true; Efeitos.texto(j.x, j.y, 70, 'Pela abertura!', '#BFD4FF'); }
    }
    if (a.r > a.max) Jogo.aneis.splice(i, 1);
  }
  atualizarZonas(dt);
  for (let i = Jogo.descargas.length - 1; i >= 0; i--) { Jogo.descargas[i].t += dt; if (Jogo.descargas[i].t > 0.35) Jogo.descargas.splice(i, 1); }
  for (let i = Jogo.feixes.length - 1; i >= 0; i--) {
    const f = Jogo.feixes[i];
    f.t += dt; f.a += f.giro * dt; f.prox = Math.max(0, f.prox - dt);
    if (f.dono) { f.x = f.dono.x; f.y = f.dono.y; }
    const fim = { x: f.x + Math.cos(f.a) * f.comp, y: f.y + Math.sin(f.a) * f.comp };
    if (f.t > 0.25 && f.prox <= 0 && !j.morto && distSeg(j, f, fim) < 13 + j.raio) { f.prox = 0.7; Combate.danoJogador(f.dano, normalizar(-Math.sin(f.a) * Math.sign(f.giro), Math.cos(f.a) * Math.sign(f.giro))); }
    if (f.t > f.dur || (f.dono && f.dono.estado !== 'feixes')) Jogo.feixes.splice(i, 1);
  }
  const amb = Jogo.ambiente;
  amb.vazio = (amb.vazio || 0) + ((amb.vazioAlvo || 0) - (amb.vazio || 0)) * (1 - Math.exp(-1.2 * dt));
  amb.poder += (amb.alvo - amb.poder) * (1 - Math.exp(-1.2 * dt));
  amb.relampago = Math.max(0, amb.relampago - dt * 2.5);
  if (amb.poder > 0.5 && Fluxo.estado === 'jogando' && Math.random() < dt * 0.18) { amb.relampago = 0.8; Som.tocar('relampago'); }
  if (amb.poder > 0.3 && Math.random() < dt * 30 * amb.poder) {
    const cam = Jogo.cam;
    Efeitos.particula(cam.x + (Math.random() - 0.5) * 900, cam.y + (Math.random() - 0.5) * 700, 160 + Math.random() * 80, { vx: (Math.random() - 0.5) * 30, vy: 20, vz: -40 - Math.random() * 40, cor: Math.random() < 0.5 ? '#FF8A4D' : '#FFD27A', vida: 2.5, tam: 1.4 + Math.random(), aditivo: true });
  }
}

// Zonas no chão: elétricas (Tempestade) e campos do Vazio (Guardião) que mudam o movimento do jogador
function atualizarZonas(dt) {
  const j = Jogo.jogador;
  j.fatorLento = 1; j.invertido = false;
  for (let i = Jogo.zonas.length - 1; i >= 0; i--) {
    const z = Jogo.zonas[i];
    z.t += dt; z.prox = Math.max(0, (z.prox || 0) - dt);
    if (z.t > z.dur) { Jogo.zonas.splice(i, 1); continue; }
    if (z.t < 0 || j.morto) continue;
    const d = distancia(j, z), dentro = d < z.raio + j.raio * 0.3;
    if (z.tipo === 'eletrica') {
      if (Math.random() < dt * 14) { const a = Math.random() * Math.PI * 2, r = Math.random() * z.raio; Efeitos.particula(z.x + Math.cos(a) * r, z.y + Math.sin(a) * r, 2, { vz: 80, cor: '#FFF2A8', vida: 0.25, tam: 1.6, aditivo: true }); }
      if (dentro && z.prox <= 0) { z.prox = z.intervalo; Combate.danoJogador(z.dano, normalizar(j.x - z.x, j.y - z.y)); Som.tocar('zonaEletrica'); }
    } else if (z.tipo === 'poco') {
      if (d < z.raio * 1.6 && d > 4 && j.intangivel <= 0) { const k = z.forca * clamp(1 - d / (z.raio * 1.6), 0.25, 1) * dt; j.x += ((z.x - j.x) / d) * k; j.y += ((z.y - j.y) / d) * k; }
      if (d < z.nucleo + j.raio * 0.5 && z.prox <= 0) { z.prox = 0.7; Combate.danoJogador(z.dano, normalizar(j.x - z.x, j.y - z.y)); }
    } else if (z.tipo === 'lento') { if (dentro) j.fatorLento = Math.min(j.fatorLento, z.fator); }
    else if (z.tipo === 'inversao') {
      if (dentro) { if (!j.invertido && !Fluxo.dicas.inversao) { Fluxo.dicas.inversao = true; Hud.aviso('Campo de inversão: seus controles estão invertidos aqui dentro!', false); } j.invertido = true; }
    }
  }
}

function atualizarProjeteisInimigos(dt) {
  const j = Jogo.jogador;
  for (let i = Jogo.projeteisInimigos.length - 1; i >= 0; i--) {
    const p = Jogo.projeteisInimigos[i];
    p.t += dt;
    let fim = false;
    if (p.guiado && !p.refletido) {
      if (!j.morto) {
        const alvo = Math.atan2(j.y - p.y, j.x - p.x), atual = Math.atan2(p.vy, p.vx);
        let da = alvo - atual; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
        const na = atual + clamp(da, -p.giro * dt, p.giro * dt), v = Math.hypot(p.vx, p.vy);
        p.vx = Math.cos(na) * v; p.vy = Math.sin(na) * v;
      }
      if (p.t > p.duracao) fim = true;
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.dist += Math.hypot(p.vx, p.vy) * dt;
    if (!fim && p.refletido) {
      for (const e of Jogo.inimigos) {
        if (!alvejavel(e) || e === p.ignorar) continue;
        if (dist2(p, e) < (p.raio + e.raio + 4) ** 2) { Combate.danoInimigo(e, p.dano, normalizar(p.vx, p.vy), 260, 0.5, { fonte: 'reflexo', rotulo: 'Reflexo!', cor: '#C9C6FF' }); fim = true; break; }
      }
    } else if (!fim && p.falsa) {
      // carta falsa: atravessa e some
      if (!j.morto && dist2(p, j) < ((j.escudo ? j.escudo.raio : j.raio) + p.raio) ** 2) {
        fim = true; Efeitos.texto(p.x, p.y, 60, 'Ilusão', '#C9D2F0'); Efeitos.faiscas(p.x, p.y, 30, 6, '#C9D2F0');
        if (!Fluxo.dicas.falsa) { Fluxo.dicas.falsa = true; Hud.toast('Cartas prateadas são ilusões: só as douradas machucam.'); }
      }
    } else if (!fim) {
      const s = j.segurando, sh = j.escudo;
      if (sh && !j.morto && dist2(p, j) < (sh.raio + p.raio) ** 2) fim = !Escudo.projetil(p);
      else if (s && dist2(p, s) < (s.raio + p.raio + 10) ** 2) {
        fim = true; s.tremer = 0.25;
        Efeitos.texto(s.x, s.y, s.z + 30, 'Bloqueado!', '#DCC0FF'); Efeitos.faiscas(s.x, s.y, s.z, 12, '#E2C8FF');
        Som.tocar('bloqueado'); Jogo.stats.bloqueios++;
      } else if (!j.morto && !p.esquivado && dist2(p, j) < (p.raio + j.raio) ** 2) {
        const r = Combate.danoJogador(p.dano, normalizar(p.vx, p.vy));
        if (r === 'esquivou') p.esquivado = true;
        else {
          fim = true;
          if (p.enraizar && r === 'dano') { j.enraizado = p.enraizar; Efeitos.texto(j.x, j.y, 84, 'Preso!', '#FFB27A'); Fluxo.evento('preso'); }
          if (p.confundir && r === 'dano') { j.confuso = p.confundir; Efeitos.texto(j.x, j.y, 84, 'Confuso!', '#E6C8FF'); Som.tocar('confuso'); Fluxo.evento('confuso'); }
        }
      }
    }
    if (!fim && (tocaEstatico(p) || foraDosLimites(p) || p.dist > p.alcance)) { fim = true; Efeitos.faiscas(p.x, p.y, 30, 6, p.refletido ? '#C9C6FF' : '#8C8498'); }
    if (fim) { const k = Jogo.projeteisInimigos.indexOf(p); if (k >= 0) Jogo.projeteisInimigos.splice(k, 1); }
  }
}

/* ========== 13. COMBATE E EFEITOS ========== */
const Combate = {
  danoInimigo(e, dano, dir, forca, atordoar, op = {}) {
    if (!alvejavel(e)) return;
    if (e.tipo === 'onix') { Chefe.receber(e, dano, dir, forca, op); return; }
    const ia = IA[e.tipo];
    if (ia && ia.receber) { ia.receber(e, dano, dir, forca, atordoar, op); return; }
    this.aplicarDano(e, dano, dir, forca, atordoar, op);
  },
  aplicarDano(e, dano, dir, forca, atordoar, op = {}) {
    e.vida -= dano; e.flash = 0.14; e.reacao = 0.18;
    e.kx = dir.x * forca; e.ky = dir.y * forca;
    if (dano > 0) Efeitos.texto(e.x, e.y, 50, String(dano), op.cor || '#FFE1A8');
    if (op.rotulo) Efeitos.texto(e.x, e.y, 70, op.rotulo, op.cor || '#FFE1A8');
    Efeitos.faiscas(e.x, e.y, 26, 10, op.fonte === 'rajada' ? '#F3D2FF' : '#C99BFF');
    Jogo.hitstop = Math.max(Jogo.hitstop, op.rotulo ? 0.08 : 0.05);
    Jogo.cam.tremor = Math.max(Jogo.cam.tremor, op.rotulo ? 7 : 5);
    Som.tocar('vultoDano'); vibrar(15);
    if (e.vida <= 0) { e.elev = 0; this.morrer(e); return; }
    if (e.estado === 'suspenso') { e.kx *= 0.3; e.ky *= 0.3; return; } // continua flutuando
    if (e.estado === 'atordoado' && e.derrubado && !op.derrubar) return; // a queda continua: combos encadeados
    e.estado = 'atordoado'; e.t = 0; e.atordoTempo = atordoar; e.derrubado = !!op.derrubar;
  },
  morrer(e) {
    e.vida = 0; e.estado = 'morrendo'; e.t = 0; e.derrubado = false;
    Jogo.stats.derrotados++;
    Som.tocar('vultoMorte');
    Efeitos.absorver(e);
    const j = Jogo.jogador;
    j.energia = Math.min(j.energiaMax, j.energia + (e.def.energiaAoMorrer || 0));
    Progressao.ganharXp(e.def.xp, e.x, e.y);
    Moedas.soltar(e.x, e.y, e.def.moedas || 0);
  },
  // Arremesso energizado: o objeto solta uma onda violeta ao bater
  estouroEnergizado(o, primeiro) {
    const c = CONFIG.combos;
    for (const e of Jogo.inimigos) {
      if (e === primeiro || !alvejavel(e) || distancia(o, e) > c.energizadoRaio + e.raio) continue;
      Combate.danoInimigo(e, c.energizadoArea, normalizar(e.x - o.x, e.y - o.y), 320, 0.9, { derrubar: true, fonte: 'objeto' });
    }
    Jogo.explosoes.push({ x: o.x, y: o.y, r: 0, rMax: c.energizadoRaio, vel: c.energizadoRaio / 0.18, dano: 0, forca: 0, atordoa: 0, acertados: new Set(), t: 0, nivel: 1, onda: 1, soVisual: true });
    Efeitos.faiscas(o.x, o.y, 20, 18, '#E6C8FF'); Som.tocar('explosao1');
    Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 6);
    Jogo.stats.energizados++; Fluxo.evento('arremessoEnergizado');
  },
  // O escudo devolve o golpe: inimigos comuns ficam tontos (bloqueio perfeito derruba)
  repelir(e, perfeito) {
    if (!e || !alvejavel(e)) return;
    const j = Jogo.jogador, n = normalizar(e.x - j.x, e.y - j.y);
    if (e.tipo === 'onix') {
      if (e.estado === 'investida') {
        e.estado = 'recuperar'; e.t = 0; e.vx = 0; e.vy = 0; e.kx = n.x * 220; e.ky = n.y * 220; e.ultimoAtaque = 'investida';
        if (perfeito) { Efeitos.texto(e.x, e.y, 120, 'Ele bateu no escudo!', '#C9C6FF'); Chefe.abalar(e); }
      }
      return;
    }
    if (categoria(e) !== 'comum') return;
    e.estado = 'atordoado'; e.t = 0; e.atordoTempo = perfeito ? 1.5 : 0.9; e.derrubado = perfeito;
    e.kx = n.x * 420; e.ky = n.y * 420; e.vx = 0; e.vy = 0;
    Efeitos.texto(e.x, e.y, 70, perfeito ? 'Contra-golpe!' : 'Repelido!', '#C9C6FF');
  },
  acertoRajada(p, e) {
    let dano = p.dano, rotulo = null, cor = '#F3D2FF';
    if (categoria(e) === 'comum' && e.estado === 'atordoado' && e.derrubado) {
      dano = Math.round(dano * CONFIG.rajada.bonusCombo); rotulo = 'Combo!'; cor = '#FFE08A';
      Jogo.stats.combos++; Som.tocar('combo');
      Fluxo.evento('combo');
    } else if (e.estado === 'suspenso') {
      dano = Math.round(dano * CONFIG.combos.aereo); rotulo = 'Combo aéreo!'; cor = '#E6C8FF';
      Jogo.stats.combosAereos++; Som.tocar('combo');
      Fluxo.evento('aereo');
    }
    Jogo.stats.acertosRajada++;
    Jogo.clarões.push({ x: p.x, y: p.y, z: p.z, t: 0, nivel: p.nivel, tipo: 'impacto' });
    Som.tocar('impactoRajada');
    this.danoInimigo(e, dano, normalizar(p.vx, p.vy), p.empurrao, 0.35, { fonte: 'rajada', rotulo, cor });
  },
  danoJogador(dano, dir, op = {}) {
    const j = Jogo.jogador;
    if (j.morto) return 'nada';
    if (j.intangivel > 0) {
      Efeitos.texto(j.x, j.y, 64, 'Esquiva!', '#9EE6FF');
      j.energia = Math.min(j.energiaMax, j.energia + CONFIG.esquiva.energiaPerfeita);
      Jogo.stats.esquivasPerfeitas++; Som.tocar('esquivaPerfeita');
      return 'esquivou';
    }
    if (j.escudo && !op.semEscudo) {
      const perfeito = Escudo.perfeito();
      const passa = Escudo.absorver(dano);
      if (op.atacante) this.repelir(op.atacante, perfeito);
      if (passa <= 0) return 'bloqueado';
      dano = passa;
    } else if (j.invencivel > 0 && !op.ignorarInvencivel) return 'nada';
    j.vida = Math.max(0, j.vida - dano); j.invencivel = CONFIG.jogador.invencivel;
    j.kx = dir.x * 420; j.ky = dir.y * 420;
    j.cargaRajada = 0; j.disparos = 0; j.cargaExplosao = 0;
    Jogo.flashDano = 1; Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 9); Jogo.hitstop = Math.max(Jogo.hitstop, 0.07);
    Efeitos.texto(j.x, j.y, 58, '-' + dano, '#FF7E97');
    Som.tocar('dano'); vibrar(45);
    Jogo.stats.danoRecebido += dano;
    if (j.vida <= 0) { j.morto = true; Telecinese.soltar(); if (j.inimigoTk) TK.largarInimigo(); if (j.supremo) j.supremo = null; Fluxo.derrota(); }
    return 'dano';
  },
  quebrar(o) {
    const i = Jogo.objetos.indexOf(o);
    if (i >= 0) Jogo.objetos.splice(i, 1);
    if (Jogo.jogador.segurando === o) Jogo.jogador.segurando = null;
    const cores = o.tipo === 'vaso' ? ['#B5643C', '#8A4A2C', '#D98A5E'] : ['#A8743F', '#7C5230', '#C99360'];
    for (let k = 0; k < 14; k++) {
      Efeitos.particula(o.x, o.y, o.z + 12, { vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, vz: 120 + Math.random() * 200, cor: cores[k % 3], vida: 0.9, tam: 2 + Math.random() * 3, gravidade: true, quadrado: true });
    }
    Som.tocar('quebra');
    Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 3);
    if (Math.random() < o.def.gota) Jogo.orbes.push({ classe: 'orbe', tipo: Math.random() < 0.6 ? 'energia' : 'vida', x: o.x, y: o.y, z: 20, vz: 220, t: 0, raio: 8 });
    else if (Math.random() < 0.5) Moedas.soltar(o.x, o.y, 2);
  },
};
const Efeitos = {
  particula(x, y, z, o) {
    if (Jogo.particulas.length > 500) Jogo.particulas.shift();
    const vida = o.vida || 0.6;
    Jogo.particulas.push({ x, y, z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0, vida, max: vida, cor: o.cor || '#fff', tam: o.tam || 2, aditivo: !!o.aditivo, gravidade: !!o.gravidade, quadrado: !!o.quadrado, segue: !!o.segue, atraso: o.atraso ?? 0.3, forma: o.forma || null, rot: Math.random() * 6 });
  },
  faiscas(x, y, z, n, cor) {

    if (Jogo.flashTela > 0) { c.fillStyle = `rgba(236,214,255,${(0.85 * Jogo.flashTela).toFixed(3)})`; c.fillRect(0, 0, this.w, this.h); }
    if (Fluxo.estado !== 'jogando') return;
    const K = CONFIG.K, cam = Jogo.cam, z = this.zoomAtual();
    const retrato = this.h > this.w, comChefe = document.body.classList.contains('com-chefe');
    const mL = 40, mR = 40, mT = retrato && comChefe ? 176 : 112, mB = 60;
    for (const e of Jogo.inimigos) {
      if (['morrendo', 'derrotado'].includes(e.estado) || e.intocavel) continue;
      const sx = (e.x - cam.x) * z + this.w / 2, sy = (e.y * K - 24 - cam.y * K) * z + this.h / 2;
      if (sx > 12 && sx < this.w - 12 && sy > 12 && sy < this.h - 12) continue;
      const cx = this.w / 2, cy = this.h / 2, dx = sx - cx, dy = sy - cy;
      const ex = dx > 0 ? (this.w - mR - cx) / dx : dx < 0 ? (mL - cx) / dx : Infinity;
      const ey = dy > 0 ? (this.h - mB - cy) / dy : dy < 0 ? (mT - cy) / dy : Infinity;
      const esc = Math.max(0, Math.min(ex, ey));
      const px = cx + dx * esc, py = cy + dy * esc, a = Math.atan2(dy, dx), s = categoria(e) === 'comum' ? (e.tipo === 'cinza' ? 0.7 : 1) : e.tipo === 'eco' ? 1.2 : 1.5;
      c.save(); c.translate(px, py); c.rotate(a); c.scale(s, s);
      c.globalAlpha = 0.75 + Math.sin(t * 6) * 0.2;
      c.fillStyle = '#FF8A4D'; c.strokeStyle = 'rgba(20,8,4,0.8)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(12, 0); c.lineTo(-8, -10); c.lineTo(-3, 0); c.lineTo(-8, 10); c.closePath(); c.fill(); c.stroke();
      c.restore();
    }
  },
};

/* ========== 16. HUD ========== */
const Hud = {

    } else if (chefe.tipo === 'tempestade') {

const CHEFES = ['onix', 'vesper', 'soberano', 'ilusionista', 'tempestade', 'colosso', 'guardiao'];

/* ========== 17. CENAS ========== */
const Cena = {
  atual: null,
  iniciar(tipo, dados = {}) {
    if (tipo === 'despertar' && !dados.poder) dados.poder = 'rajada';
    this.atual = { tipo, t: 0, marcas: {}, ...dados };
    Fluxo.estado = 'cena';
    Entrada.limpar(); Hud.esconderAviso();
    const j = Jogo.jogador;
    if ((j.segurando || j.extras.length) && tipo === 'despertar') Telecinese.soltar();
    if (j.inimigoTk) TK.largarInimigo();
    j.cargaRajada = 0; j.disparos = 0; j.cargaExplosao = 0; j.segundaOnda = 0;
    if (tipo === 'despertar' || tipo.endsWith('Intro')) Escudo.terminar(false);
    document.body.classList.add('em-cena');
  },
  terminar() {
    this.atual = null;
    Jogo.camAlvo = null; Jogo.camZoomAlvo = 1;
    document.body.classList.remove('em-cena');
    if (Fluxo.estado === 'cena') Fluxo.estado = 'jogando';
  },
  uma(c, nome, quando, fn) { if (c.t >= quando && !c.marcas[nome]) { c.marcas[nome] = true; fn(); } },
  limparOutros(e, dt) {
    for (let i = Jogo.inimigos.length - 1; i >= 0; i--) { const v = Jogo.inimigos[i]; if (v !== e) { v.t += dt; if (v.t > 0.7) Jogo.inimigos.splice(i, 1); } }
  },
  atualizar(dt) {
    const c = this.atual;
    if (!c) return;
    c.t += dt;
    const j = Jogo.jogador;
    if (c.tipo === 'despertar') {
      this.despertar(c, dt, j);
    } else if (c.tipo === 'chefeIntro') {
      const mono = Jogo.objetos.find((o) => o.tipo === 'monolito');
      if (!c.pos) c.pos = mono ? { x: mono.x, y: mono.y } : { x: 1160, y: 470 };
      Jogo.camAlvo = { x: c.pos.x, y: c.pos.y - 50 }; Jogo.camZoomAlvo = 1.15;
      this.uma(c, 'tremor', 0.1, () => { Som.tocar('tremor'); if (mono) mono.tremer = 1.6; });
      if (c.t < 1.6) Jogo.cam.tremor = Math.max(Jogo.cam.tremor, 2 + c.t * 3);
      this.uma(c, 'quebra', 1.6, () => {
        const i = Jogo.objetos.indexOf(mono); if (i >= 0) Jogo.objetos.splice(i, 1);
        for (let k = 0; k < 30; k++) Efeitos.particula(c.pos.x, c.pos.y, 30 + Math.random() * 40, { vx: (Math.random() - 0.5) * 360, vy: (Math.random() - 0.5) * 260, vz: 150 + Math.random() * 250, cor: k % 2 ? '#3A3748' : '#565266', vida: 1.2, tam: 3 + Math.random() * 4, gravidade: true, quadrado: true });
        const chefe = novoInimigo('onix', c.pos.x, c.pos.y + 10);
        Jogo.inimigos.push(chefe); c.chefe = chefe;
        Som.tocar('chefeRugido'); vibrar([80, 40, 80]);
        Jogo.cam.tremor = 14; Jogo.flashTela = 0.35;
      });
      if (c.chefe) c.chefe.t += dt;
      this.uma(c, 'nome', 2.1, () => { const d = TIPOS_INIMIGO.onix; Hud.anunciar('Um novo inimigo', d.nome, `“${d.falas.inicio}”`, 'chefe-intro', 2.6); });
      this.uma(c, 'fim', 4.4, () => {
        if (c.chefe) { c.chefe.estado = 'andar'; c.chefe.t = 0; c.chefe.prox = 1.4; }
        this.terminar();
        Hud.aviso(ehToque() ? 'Ônix bloqueia a Rajada. Arremesse objetos para abalá-lo e ataque o núcleo exposto.' : 'Ônix bloqueia a Rajada. Arremesse objetos (Espaço) para abalá-lo e use a Rajada (F) no núcleo exposto.', false);
        Hud.tAviso = 6;
      });
    } else if (c.tipo === 'chefeDerrota') {
      const e = c.chefe, d = e.def, fem = e.tipo === 'vesper' || e.tipo === 'tempestade';
      Jogo.camAlvo = { x: e.x, y: e.y - 10 }; Jogo.camZoomAlvo = 1.2;
      e.t += dt;

      this.limparOutros(e, dt);
      this.uma(c, 'som', 0.05, () => { Som.tocar(fem ? 'escudoQuebra' : 'quedaChefe'); Jogo.flashTela = 0.5; vibrar([100, 50, 100]); Jogo.cam.tremor = 10; });

    if (novo) { this.dicas['tipo_' + novo] = true; Hud.aviso(`Novo inimigo comum · ${TIPOS_INIMIGO[novo].dica}`, false); Hud.tAviso = 5.5; return; }
    const v = TIPOS_INIMIGO.vulto;
    const msgs = {
      ato1: [`${v.nome}: ${v.personalidade.split('.')[0]}. Arremesse objetos nele!`, 'Dois Vultos! Empurrar afasta os inimigos. Esquivar escapa dos ataques.', 'Última onda: três Vultos. Quando brilharem em laranja, esquive!'],
      ato2: ['Use a Rajada nos Vultos. Ela também funciona enquanto você segura um objeto.', 'Derrube um Vulto com telecinese e finalize com a Rajada para fazer um Combo!'],

      ato4: ['', '', 'Última onda: tudo junto. Explosão para o bando, Escudo para os disparos.'],
      ato9: ['Com a Supremacia ativa, a Rajada dispara um projétil a mais e o Escudo devolve disparos.', 'No modo Força, a Onda de força limpa o cerco. No Domínio, a Prisão segura qualquer um.', 'Última onda: guarde o Golpe Supremo para quando estiver cercado.'],
      ato6: ['Suspenda um inimigo com a Gravidade e acerte-o no ar com a Rajada: Combo aéreo!', 'Com um campo ativo, a Explosão faz o campo implodir e acerta todos dentro dele.', 'Erga um objeto e dispare a Rajada nele antes de arremessar: ele sai Energizado.'],
    };

  concluirMissao() {
    const j = Jogo.jogador, cfg = CONFIG.campanha[this.etapa];
    Progressao.ganharXp(cfg.bonus || 0, j.x, j.y);

    if (this.etapa === 'ato1') {
      const tinha = j.rajadaNivel > 0;
      this.aoTerminarDespertar = () => this.comecar('ato2', { xp: Jogo.jogador.xp, manterPosicao: true });
      if (tinha || !this.fila.some((ev) => ev.recompensa && ev.recompensa.tipo === 'despertar')) {
        const fn = this.aoTerminarDespertar; this.aoTerminarDespertar = null;
        setTimeout(fn, 1800);
      }
    } else if (this.etapa === 'ato9') {
      if (!Perfil.liberou('vazio')) {
        this.aoTerminarDespertar = () => { this.aguardandoVazio = true; Hud.aviso(ehToque() ? 'Toque no portal do Vazio, no alto da tela, para atravessar a fenda.' : 'Aperte B (ou clique no portal no alto da tela) para atravessar a fenda.', true); };
        setTimeout(() => { if (this.etapa === 'ato9' && this.estado === 'jogando') Cena.iniciar('despertar', { poder: 'vazio' }); }, 1600);
      } else setTimeout(() => { if (this.etapa === 'ato9' && this.estado === 'jogando') this.finalizarAto9(); }, 1800);

  },
  // Ônix ou Vésper derrotados
  recompensaEspecial(e) {
    const d = e.def, P = Perfil.dados, primeira = !P.campanha[e.tipo];
    Progressao.ganharXp(d.xp, e.x, e.y);
    Moedas.chuva(Jogo.jogador.x, Jogo.jogador.y, d.moedas, 12, true);
    P.campanha[e.tipo] = true; Perfil.gravar();
    this.resultado = { tipo: e.tipo, primeira, tempo: this.tempoJogo };
    this.vitoriaEspecial = e.tipo; this.finalPendente = 2.2;
  },
  recompensaSoberano(e) {
    const d = e.def, P = Perfil.dados, j = Jogo.jogador, primeira = !P.campanha.soberano;
    Progressao.ganharXp(d.xp, j.x, j.y);
    Moedas.chuva(j.x, j.y, d.moedas, 18, true);
    P.campanha.soberano = true;
    Perfil.ganharItem('traje', 'soberana'); Perfil.ganharItem('acessorio', 'coroa');
    const R = P.recordes, tempo = this.tempoJogo;
    R.soberano++; if (!R.melhorTempo || tempo < R.melhorTempo) R.melhorTempo = tempo; if (!R.primeiraVitoria) R.primeiraVitoria = Date.now();
    Perfil.gravar();
    this.resultado = { tipo: 'soberano', primeira, tempo };
    this.vitoriaEspecial = 'soberano'; this.finalPendente = 2.6;
  },
  recompensaGuardiao(e) {
    const d = e.def, P = Perfil.dados, j = Jogo.jogador, primeira = !P.campanha.guardiao;
    Progressao.ganharXp(d.xp, j.x, j.y);
    Moedas.chuva(j.x, j.y, d.moedas, 20, true);
    P.campanha.guardiao = true;
    Perfil.ganharItem('traje', 'vazio'); Perfil.ganharItem('efeito', 'vazio');
    const R = P.recordes, tempo = this.tempoJogo;
    R.guardiao = (R.guardiao || 0) + 1; if (!R.tempoGuardiao || tempo < R.tempoGuardiao) R.tempoGuardiao = tempo;
    Perfil.gravar();
    this.resultado = { tipo: 'guardiao', primeira, tempo };
    this.vitoriaEspecial = 'guardiao'; this.finalPendente = 2.6;
  },
  vitoriaFinal() {
    if (this.vitoriaEspecial === 'guardiao') { Hud.esconderAviso(); Cena.iniciar('pressagio'); return; }
    this.estado = 'vitoria';
    Hud.esconderAviso();
    Som.tocar('vitoria'); vibrar([40, 60, 40, 60, 80]);
    if (this.vitoriaEspecial === 'soberano') Telas.vitoriaSoberano(); else Telas.vitoriaEspecial(this.vitoriaEspecial || 'onix');
  },
  derrota() {
    this.estado = 'derrota';
    Hud.esconderAviso();
    Som.tocar('derrota');
    if (this.etapa === 'arena') { const R = Perfil.dados.recordes; R.arena = Math.max(R.arena, this.onda); Perfil.gravar(); }
    setTimeout(() => Telas.derrota(), 1300);
  },
  alternarPausa(aba) {
    if (this.estado === 'jogando') { this.estado = 'pausa'; Entrada.limpar(); Telas.pausa(aba || 'jogo'); }
    else if (this.estado === 'pausa') { this.estado = 'jogando'; Telas.fechar(); Perfil.gravar(); }
  },
};

  // Pontos de habilidade: três atributos por poder, três graus cada
  montarEvolucao(painel) {
    const j = Jogo.jogador, livres = Perfil.pontosLivres();
    const blocos = Hud.ATIVOS.map((id) => {
      const p = PODERES.find((x) => x.id === id), nivel = this.nivelPoder(id), livre = nivel > 0;
      const attrs = MELHORIAS[id].map((m) => {
        const g = Perfil.grau(id, m.id), max = g >= 3, custo = CUSTO_MELHORIA[g] || 0;
        const efeito = g ? `${m.passo > 0 ? '+' : '−'}${Math.round(Math.abs(m.passo) * g * 100)}%` : 'base';
        const rot = !livre ? 'Bloq.' : max ? 'Máx.' : `+ ${custo} pt`;
        const pode = livre && !max && livres >= custo;
        return `<div class="evo__attr"><div><b>${m.nome}</b><small>${efeito} · ${m.desc}</small></div><span class="graus" aria-label="grau ${g} de 3">${[0, 1, 2].map((k) => `<i class="${k < g ? 'on' : ''}"></i>`).join('')}</span><button class="btn-mais" data-poder="${id}" data-attr="${m.id}" ${pode ? '' : 'disabled'} aria-label="Melhorar ${m.nome} de ${p.nome}">${rot}</button></div>`;
      }).join('');
      const desc = livre ? ({ telecinese: 'Controle do ambiente e dos inimigos.', rajada: 'Ataque à distância.', escudo: 'Defesa.', explosao: 'Ataque em área.', gravidade: 'Controle de grupo e combinações.', supremacia: 'Transformação que amplifica tudo.', vazio: 'Sua dimensão particular.' }[id]) : Progressao.descricaoPoder(id, j);
      return `<div class="evo__poder ${livre ? '' : 'bloqueada'}"><div class="evo__topo">${this.slotHtml(p, livre, nivel)}<strong>${p.nome}${livre ? ` · nível ${nivel}` : ''}</strong><span>${desc}</span></div>${attrs}</div>`;
    }).join('');
    painel.innerHTML = `

      <div class="evo">${blocos}</div>
      <button class="btn btn--secundario btn--pequeno" id="b-redefinir">Redistribuir pontos</button>`;
    painel.querySelectorAll('.btn-mais').forEach((b) => b.addEventListener('click', () => {
      const r = Perfil.melhorar(b.dataset.poder, b.dataset.attr);
      if (r === 'ok') { Som.tocar('melhoria'); vibrar(15); } else Som.tocar('erro');
      this.montarEvolucao(painel);

    }));
    painel.querySelector('#b-redefinir').addEventListener('click', (e) => {

  // Loja de aparência: só visual
  montarVisual(painel, cat = 'traje', previa = null) {
    const P = Perfil.dados, catDef = COSMETICOS[cat];
    const amostra = (it) => {
      if (cat === 'traje') return `<span class="item__amostra"><i style="background:${it.cores.moletom}"></i><i style="background:${it.cores.moletomClaro}"></i><i style="background:${it.cores.calca}"></i><i style="background:${it.cores.tenis}"></i></span>`;
      if (cat === 'cabelo') return `<span class="item__amostra"><i style="background:${it.cor}"></i></span>`;
      if (cat === 'acessorio') return `<span class="item__amostra"><i style="background:${it.cor || 'rgba(255,255,255,.06)'}"></i></span>`;
      const simb = { padrao: '● ● ●', estrela: '✦ ✦ ✦', petala: '❀ ❀ ❀', cristal: '◆ ◆ ◆', vazio: '◯ ◯ ◯' }[it.id];
      return `<span class="item__amostra" style="align-items:center;justify-content:center;color:#E2C8FF;background:rgba(122,61,240,.25)">${simb}</span>`;
    };
    const itens = catDef.itens.map((it) => {
      const tem = Perfil.possui(cat, it.id), eq = P.equipado[cat] === it.id, sel = previa === it.id;
      let st;
      if (eq) st = 'Equipado';
      else if (tem) st = 'Toque para equipar';
      else if (it.preco === null) st = it.especial;
      else st = sel ? `Toque de novo para comprar` : `${ICONE_MOEDA} <span class="item__preco">${it.preco}</span>`;
      return `<button class="item ${eq ? 'equipado' : ''} ${!tem && it.preco === null ? 'travado' : ''}" data-id="${it.id}">${amostra(it)}<b>${it.nome}</b><small>${it.desc ? it.desc + ' · ' : ''}${st}</small></button>`;
    }).join('');
    const cats = Object.entries(COSMETICOS).map(([id, c]) => `<button class="cat" role="tab" data-cat="${id}" aria-selected="${id === cat}">${c.nome}</button>`).join('');
    painel.innerHTML = `

        <div style="display:grid;gap:8px"><div class="saldo"><span>Moedas</span><strong>${ICONE_MOEDA} ${P.moedas}</strong></div>
        <p class="nota" style="text-align:left">Moedas compram só aparência. A força vem da experiência e dos pontos de habilidade.</p></div></div>
      <div class="categorias" role="tablist">${cats}</div>
      <div class="itens">${itens}</div>`;
    this.desenharPrevia(painel.querySelector('#previa'), cat, previa);

    painel.querySelectorAll('.item').forEach((b) => b.addEventListener('click', () => {
      const id = b.dataset.id, it = catDef.itens.find((x) => x.id === id);
      if (Perfil.possui(cat, id)) { Perfil.equipar(cat, id); Som.tocar('clique'); this.montarVisual(painel, cat); return; }
      if (it.preco === null) { Som.tocar('erro'); this.montarVisual(painel, cat, id); return; }
      if (previa !== id) { Som.tocar('clique'); this.montarVisual(painel, cat, id); return; }

  desenharPrevia(cv, cat, previa) {
    if (!cv) return;
    const c = cv.getContext('2d'), eq = { ...Perfil.dados.equipado };

    c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);

// Desenho extra no mundo (antes das luzes) e na tela (depois de tudo)
const Ext = {
  desenharMundo(c, t, j) {
    const K = CONFIG.K;
    Supremacia.desenharCristais(c, t);
    if (Vazio.ativo) Vazio.desenharMundo(c, t, j);
    // efeitos da telecinese
    for (const f of TK.fx) {
      const k = f.t / f.dur;
      c.save(); c.translate(f.x, f.y * K); c.scale(1, K);
      if (f.tipo === 'atrair') {
        const a0 = Math.atan2(f.dir.y, f.dir.x);
        for (let q = 0; q < 3; q++) {
          const p = ((k * 2 + q / 3) % 1), r = f.alcance * (1 - p);
          c.strokeStyle = `rgba(214,190,255,${(0.6 * (1 - k) * p).toFixed(3)})`; c.lineWidth = 3;
          c.beginPath(); c.arc(0, 0, Math.max(4, r), a0 - f.ab, a0 + f.ab); c.stroke();
        }
      } else if (f.tipo === 'onda') {
        for (let q = 0; q < 3; q++) {
          const p = clamp((f.t - q * 0.08) / (f.dur * 0.7), 0, 1);
          if (p <= 0 || p >= 1) continue;
          const e = 1 - Math.pow(1 - p, 3);
          c.strokeStyle = `rgba(240,232,255,${(0.75 * (1 - p)).toFixed(3)})`; c.lineWidth = 7 * (1 - p) + 1;
          circulo(c, 0, 0, f.raio * e); c.stroke();
        }
        const g = c.createRadialGradient(0, 0, 0, 0, 0, f.raio);
        g.addColorStop(0, `rgba(220,200,255,${(0.18 * (1 - k)).toFixed(3)})`); g.addColorStop(1, 'rgba(220,200,255,0)');
        c.fillStyle = g; circulo(c, 0, 0, f.raio); c.fill();
      }
      c.restore();
    }
    // jaulas da Prisão
    for (const p of TK.prisoes) {
      const e = p.e, fim = p.fim ? clamp(1 - p.fim / 0.3, 0, 1) : 1, entra = clamp(p.t / 0.2, 0, 1), a = fim * entra;
      if (a <= 0) continue;
      const R = (e.raio + 10) * (categoria(e) === 'comum' ? 1 : 1.15), H = categoria(e) === 'comum' ? 62 : e.raio * 3, ex = e.x, ey = e.y * K - (e.elev || 0);
      c.save(); c.globalAlpha = a;
      c.strokeStyle = 'rgba(214,180,255,0.9)'; c.lineWidth = 2;
      elipse(c, ex, ey, R, R * K * 0.6); c.stroke(); elipse(c, ex, ey - H, R * 0.9, R * K * 0.5); c.stroke();
      for (let q = 0; q < 6; q++) {
        const ang = (q / 6) * Math.PI * 2 + t * 1.2, bx = Math.cos(ang), by = Math.sin(ang);
        c.globalAlpha = a * (by > 0 ? 1 : 0.4);
        c.beginPath(); c.moveTo(ex + bx * R, ey + by * R * K * 0.6); c.lineTo(ex + bx * R * 0.9, ey - H + by * R * K * 0.5); c.stroke();
      }
      c.globalAlpha = a; c.fillStyle = 'rgba(230,210,255,0.9)';
      const ry = ey - H - 8 + Math.sin(t * 4) * 2;
      c.beginPath(); c.moveTo(ex, ry - 6); c.lineTo(ex + 4, ry); c.lineTo(ex, ry + 6); c.lineTo(ex - 4, ry); c.closePath(); c.fill();
      c.restore();
    }
    // alvo do Impacto e laço com o inimigo erguido
    for (const o of Jogo.objetos) {
      if (o.estado !== 'impacto' || !o.imp) continue;
      const k = clamp(o.imp.t / o.imp.dur, 0, 1), r = (CONFIG.tk.impacto.raioBase + o.def.peso * 18) * (1.2 - k * 0.5);
      c.save(); c.translate(o.imp.px, o.imp.py * K); c.scale(1, K);
      c.strokeStyle = `rgba(230,200,255,${(0.4 + k * 0.5).toFixed(3)})`; c.lineWidth = 2; c.setLineDash([8, 6]); c.lineDashOffset = -t * 30;
      circulo(c, 0, 0, r); c.stroke(); c.setLineDash([]);
      c.restore();
    }
    const ei = j.inimigoTk;
    if (ei && !j.morto) {
      const gy = j.y * K - j.z - 26, oy = ei.y * K - (ei.elev || 0) - 18;
      c.strokeStyle = 'rgba(205,160,255,0.8)'; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(j.x, gy);
      for (let q = 1; q <= 6; q++) { const f = q / 6; c.lineTo(lerp(j.x, ei.x, f) + (Math.random() - 0.5) * 8 * (1 - Math.abs(f - 0.5)), lerp(gy, oy, f) + (Math.random() - 0.5) * 8); }
      c.stroke();
      c.save(); c.translate(ei.x, ei.y * K); c.scale(1, K); c.rotate(t * 2);
      c.strokeStyle = 'rgba(214,180,255,0.7)'; c.lineWidth = 2; c.setLineDash([6, 5]); circulo(c, 0, 0, ei.raio + 10); c.stroke(); c.setLineDash([]);
      c.restore();
      if (Jogo.mira) {
        c.save(); c.translate(ei.x, ei.y * K); c.scale(1, K); c.rotate(Math.atan2(Jogo.mira.y, Jogo.mira.x));
        c.strokeStyle = 'rgba(214,180,255,0.9)'; c.lineWidth = 3; c.setLineDash([10, 9]); c.beginPath(); c.moveTo(20, 0); c.lineTo(300, 0); c.stroke(); c.setLineDash([]);
        c.restore();
      }
    }
    // golpe supremo carregando: anel que se fecha no chão
    const s = j.supremo;
    if (s && s.golpe > 0) {
      const k = 1 - s.golpe / CONFIG.supremacia.golpe.preparo, R = CONFIG.supremacia.golpe.raio * (1 - k * 0.85);
      c.save(); c.translate(j.x, j.y * K); c.scale(1, K); c.rotate(t * 3);
      c.strokeStyle = `rgba(255,224,138,${(0.3 + k * 0.6).toFixed(3)})`; c.lineWidth = 3; circulo(c, 0, 0, R); c.stroke();
      for (let q = 0; q < 6; q++) { const a = (q / 6) * Math.PI * 2; c.fillStyle = 'rgba(230,200,255,0.85)'; c.beginPath(); c.moveTo(Math.cos(a) * R, Math.sin(a) * R - 8); c.lineTo(Math.cos(a) * R + 5, Math.sin(a) * R); c.lineTo(Math.cos(a) * R, Math.sin(a) * R + 8); c.lineTo(Math.cos(a) * R - 5, Math.sin(a) * R); c.closePath(); c.fill(); }
      c.restore();
    }
    // portal da travessia
    const tr = Vazio.transicao;
    if (tr) {
      const meio = tr.dur * 0.5, k = tr.trocou ? clamp(1 - (tr.t - meio) / meio, 0, 1) : clamp(tr.t / meio, 0, 1), R = 18 + 34 * Math.sin(k * Math.PI * 0.5);
      c.save(); c.translate(tr.x, tr.y * K - 34); c.scale(1, 1.45);
      const g = c.createRadialGradient(0, 0, 2, 0, 0, R);
      g.addColorStop(0, 'rgba(6,3,16,0.95)'); g.addColorStop(0.65, 'rgba(60,34,140,0.85)'); g.addColorStop(1, 'rgba(190,160,255,0)');
      c.fillStyle = g; circulo(c, 0, 0, R); c.fill();
      c.strokeStyle = 'rgba(214,196,255,0.85)'; c.lineWidth = 2;
      for (let q = 0; q < 3; q++) { c.beginPath(); c.arc(0, 0, R * (0.55 + q * 0.18), t * (4 + q) + q, t * (4 + q) + q + 2.4); c.stroke(); }
      c.restore();
    }
    // despertares da Supremacia e do Vazio
    const cena = Cena.atual;
    if (cena && cena.tipo === 'despertar' && (cena.poder === 'vazio' || cena.poder === 'supremacia')) {
      const k = clamp((cena.t - 0.6) / 1.8, 0, 1), some = cena.t > 3.4 ? clamp(1 - (cena.t - 3.4) / 0.6, 0, 1) : 1;
      if (k > 0 && some > 0) {
        c.save(); c.globalAlpha = some;
        if (cena.poder === 'vazio') {
          c.translate(j.x, j.y * K - 60); c.scale(1, 1.5);
          const R = 70 * k, g = c.createRadialGradient(0, 0, 2, 0, 0, R);
          g.addColorStop(0, 'rgba(6,3,16,0.95)'); g.addColorStop(0.7, 'rgba(50,30,130,0.8)'); g.addColorStop(1, 'rgba(160,140,255,0)');
          c.fillStyle = g; circulo(c, 0, 0, R); c.fill();
          c.strokeStyle = 'rgba(214,196,255,0.8)'; c.lineWidth = 2;
          for (let q = 0; q < 4; q++) { c.beginPath(); c.arc(0, 0, R * (0.4 + q * 0.16), t * (2 + q) + q, t * (2 + q) + q + 2); c.stroke(); }
        } else {
          for (let q = 0; q < 6; q++) {
            const a = (q / 6) * Math.PI * 2 + t * 1.2, x = j.x + Math.cos(a) * 64, y = (j.y + Math.sin(a) * 50) * K - 20 - k * 30;
            c.fillStyle = q === 5 ? '#FFE08A' : '#D9B8FF'; c.strokeStyle = '#4A1C9C'; c.lineWidth = 1;
            c.beginPath(); c.moveTo(x, y - 12); c.lineTo(x + 6, y); c.lineTo(x, y + 12); c.lineTo(x - 6, y); c.closePath(); c.fill(); c.stroke();
          }
        }
        c.restore();
      }
    }
    // luz extra: aura suprema, projéteis supremos, inimigo erguido
    c.save(); c.globalCompositeOperation = 'lighter';
    const brilho = (x, y, r, cor, a) => { if (a <= 0 || r <= 0) return; const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, cor.replace('A', a)); g.addColorStop(1, cor.replace('A', 0)); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); };
    if (s) { brilho(j.x, j.y * K - j.z - 28, 110 + Math.sin(t * 5) * 10, 'rgba(190,120,255,A)', 0.42); brilho(j.x, j.y * K, 160, 'rgba(255,214,140,A)', 0.12); }
    for (const p of Jogo.projeteis) if (p.supremo) brilho(p.x, p.y * K - p.z, p.raio * 5, 'rgba(255,224,138,A)', 0.45);
    if (ei) brilho(ei.x, ei.y * K - (ei.elev || 0) - 16, 50, 'rgba(170,100,255,A)', 0.45);
    for (const o of TK.orbita()) brilho(o.x, o.y * K - o.z - 12, 34, 'rgba(170,100,255,A)', 0.35);
    c.restore();
  },
  desenharTela(c, t) {
    const w = Render.w, h = Render.h, tr = Vazio.transicao;
    c.save(); c.setTransform(Render.dpr, 0, 0, Render.dpr, 0, 0);
    if (tr) {
      const meio = tr.dur * 0.5, k = tr.trocou ? clamp(1 - (tr.t - meio) / meio, 0, 1) : clamp(tr.t / meio, 0, 1);
      const g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * (0.6 - k * 0.45), w / 2, h / 2, Math.max(w, h) * 0.75);

    }
    const j = Jogo.jogador;
    if (j && j.supremo) {
      const a = 0.16 + Math.sin(t * 4) * 0.04;
      const g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.45, w / 2, h / 2, Math.max(w, h) * 0.72);
      g.addColorStop(0, 'rgba(120,50,220,0)'); g.addColorStop(1, `rgba(120,50,220,${a.toFixed(3)})`);

    }
    c.restore();
  },
};

    if (m.excl) reqs.push(`<span class="excl ${Perfil.grau(poder, m.excl) ? 'tomado' : ''}">Exclusivo com ${Perfil.no(poder, m.excl).nome}</span>`);

// --- loja com provador ---
Telas._loja = { cat: 'traje', grupo: 'Casual', sel: null, conf: false, vista: 'frente' };
Telas.montarVisual = function (painel, catIni, previaIni) {
  const L = this._loja, P = Perfil.dados;
  if (catIni && COSMETICOS[catIni]) { if (catIni !== L.cat) { L.sel = null; L.conf = false; } L.cat = catIni; }
  if (previaIni !== undefined && previaIni !== null) L.sel = previaIni;
  const cat = L.cat, def = COSMETICOS[cat];
  const sel = L.sel ? def.itens.find((x) => x.id === L.sel) : null;
  const estado = (it) => {
    if (P.equipado[cat] === it.id) return 'equipado';
    if (Perfil.possui(cat, it.id)) return 'possui';
    if (it.preco === null) return 'recompensa';
    if (it.req && !it.req.ok()) return 'requisito';
    return 'loja';
  };
  const amostra = (it) => {
    if (cat === 'traje') return `<span class="item__amostra"><i style="background:${it.cores.moletom}"></i><i style="background:${it.cores.moletomClaro}"></i><i style="background:${it.cores.calca}"></i><i style="background:${it.cores.tenis}"></i></span>`;
    if (cat === 'efeito') { const simb = { padrao: '● ● ●', estrela: '✦ ✦ ✦', petala: '❀ ❀ ❀', cristal: '◆ ◆ ◆', vazio: '◯ ◯ ◯' }[it.id]; return `<span class="item__amostra" style="align-items:center;justify-content:center;color:#E2C8FF;background:rgba(122,61,240,.25)">${simb}</span>`; }
    return `<span class="item__amostra"><i style="background:${it.cor || (cat === 'penteado' ? COR_JOGADOR.cabelo : 'rgba(255,255,255,.06)')}"></i>${it.cor2 ? `<i style="background:${it.cor2}"></i>` : ''}</span>`;
  };
  let lista = def.itens;
  if (cat === 'traje') lista = lista.filter((it) => (it.grupo || 'Casual') === L.grupo);
  const itens = lista.map((it) => {
    const st = estado(it), rot = { equipado: 'Equipado', possui: 'Você possui', recompensa: 'Recompensa', requisito: `${ICONE_MOEDA} ${it.preco} · bloqueado`, loja: `${ICONE_MOEDA} <span class="item__preco">${it.preco}</span>` }[st];
    return `<button class="item ${st === 'equipado' ? 'equipado' : ''} ${st === 'recompensa' || st === 'requisito' ? 'travado' : ''} ${L.sel === it.id ? 'selecionado' : ''}" data-id="${it.id}">${amostra(it)}<b>${it.nome}</b><small>${rot}</small></button>`;
  }).join('');
  const cats = ORDEM_LOJA.map((id) => `<button class="cat" role="tab" data-cat="${id}" aria-selected="${id === cat}">${COSMETICOS[id].nome}</button>`).join('');
  const grupos = cat === 'traje' ? `<div class="categorias categorias--grupos">${GRUPOS_TRAJE.map((g) => `<button class="cat cat--grupo" data-grupo="${g}" aria-selected="${g === L.grupo}">${g}</button>`).join('')}</div>` : '';
  let info, acoes = '';
  if (!sel) info = `<b>Provador</b><small>Toque numa peça para experimentar antes de comprar.</small>`;
  else {
    const st = estado(sel), falta = (sel.preco || 0) - P.moedas;
    info = `<b>${sel.nome}</b><small>${cat === 'traje' ? sel.grupo + ' · ' : ''}${sel.desc || COSMETICOS[cat].nome}</small>`;
    if (st === 'equipado') acoes = `<button class="btn btn--secundario btn--pequeno" disabled>Equipado</button>`;
    else if (st === 'possui') acoes = `<button class="btn btn--primario btn--pequeno" id="b-equipar">Equipar</button>`;
    else if (st === 'recompensa') info += `<small class="loja__aviso">${sel.especial}</small>`;
    else if (st === 'requisito') info += `<small class="loja__aviso">Requisito: ${sel.req.txt} · ${ICONE_MOEDA} ${sel.preco}</small>`;
    else if (L.conf) acoes = `<small>Saldo depois: ${ICONE_MOEDA} ${P.moedas - sel.preco}</small><button class="btn btn--primario btn--pequeno" id="b-confirmar">Confirmar compra</button><button class="btn btn--secundario btn--pequeno" id="b-cancelar">Cancelar</button>`;
    else if (falta > 0) acoes = `<button class="btn btn--secundario btn--pequeno" disabled>Faltam ${falta} moedas</button>`;
    else acoes = `<button class="btn btn--primario btn--pequeno" id="b-comprar">Comprar · ${ICONE_MOEDA} ${sel.preco}</button>`;
  }
  painel.innerHTML = `
    <div class="loja-topo"><canvas class="previa" id="previa" width="184" height="232" aria-label="Prévia do personagem"></canvas>
      <div class="provador"><div class="saldo"><span>Moedas</span><strong>${ICONE_MOEDA} ${P.moedas}</strong></div>
        <div class="provador__info">${info}</div>
        <div class="provador__acoes">${acoes}<button class="btn btn--secundario btn--pequeno" id="b-girar">Girar (${{ frente: 'frente', lado: 'lado', costas: 'costas' }[L.vista]})</button>${sel ? '<button class="btn btn--secundario btn--pequeno" id="b-tirar">Tirar a prévia</button>' : ''}</div>
      </div></div>
    <div class="categorias categorias--loja" role="tablist">${cats}</div>
    ${grupos}
    <div class="itens">${itens}</div>
    <p class="nota">Combine peças à vontade. Moedas compram só aparência: a força vem da experiência e dos pontos de habilidade.</p>`;
  const eq = { ...P.equipado };
  if (sel) eq[cat] = sel.id;
  this.desenharPrevia(painel.querySelector('#previa'), eq, L.vista);
  const re = () => this.montarVisual(painel);
  painel.querySelectorAll('.cat[data-cat]').forEach((b) => b.addEventListener('click', () => { Som.tocar('clique'); L.cat = b.dataset.cat; L.sel = null; L.conf = false; re(); }));
  painel.querySelectorAll('.cat[data-grupo]').forEach((b) => b.addEventListener('click', () => { Som.tocar('clique'); L.grupo = b.dataset.grupo; re(); }));
  painel.querySelectorAll('.item').forEach((b) => b.addEventListener('click', () => { Som.tocar('clique'); L.sel = b.dataset.id; L.conf = false; re(); }));
  const on = (id, fn) => { const b = painel.querySelector(id); if (b) b.addEventListener('click', fn); };
  on('#b-girar', () => { Som.tocar('clique'); L.vista = { frente: 'lado', lado: 'costas', costas: 'frente' }[L.vista]; re(); });
  on('#b-tirar', () => { Som.tocar('clique'); L.sel = null; L.conf = false; re(); });
  on('#b-equipar', () => { Perfil.equipar(cat, sel.id); Som.tocar('clique'); re(); });
  on('#b-comprar', () => { Som.tocar('clique'); L.conf = true; re(); });
  on('#b-cancelar', () => { Som.tocar('clique'); L.conf = false; re(); });
  on('#b-confirmar', () => {
    const r = Perfil.comprar(cat, sel.id);
    L.conf = false;
    if (r === 'ok') { Som.tocar('compra'); vibrar(20); Hud.toast(`${sel.nome} comprado e equipado.`); }
    else { Som.tocar('erro'); Hud.toast(r === 'moedas' ? `Faltam ${sel.preco - P.moedas} moedas.` : r === 'requisito' ? `Requisito: ${sel.req.txt}.` : 'Não foi possível comprar.'); }
    re();
  });
};
Telas.desenharPrevia = function (cv, eq, vista = 'frente') {
  if (!cv) return;
  if (typeof eq === 'string') eq = { ...Perfil.dados.equipado };
  const c = cv.getContext('2d');
  Visual.comEquipado(eq, () => {
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    const g = c.createRadialGradient(92, 170, 10, 92, 170, 110); g.addColorStop(0, 'rgba(181,123,255,0.35)'); g.addColorStop(1, 'rgba(181,123,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
    c.fillStyle = 'rgba(0,0,0,0.35)'; elipse(c, 92, 204, 36, 10); c.fill();
    c.setTransform(2.6, 0, 0, 2.6, 0, 0);
    const olhar = vista === 'lado' ? { x: 1, y: 0 } : vista === 'costas' ? { x: 0, y: -1 } : { x: 0, y: 1 };
    const falso = { x: 92 / 2.6, y: (204 / 2.6) / CONFIG.K, z: 0, velocidade: 0, esquiva: 0, segurando: null, extras: [], poseTk: 0, poseRajada: 0, cargaRajada: 0, invencivel: 0, morto: false, correndo: false, olhar, dir: vista === 'lado' ? 'lado' : vista === 'costas' ? 'cima' : 'baixo', piscar: 1, fase: 0, dirEsquiva: { x: 0, y: 0 } };
    desenharJogador(c, falso, Jogo.tempo || 0);
    c.setTransform(1, 0, 0, 1, 0, 0);
  });
};

  if (Fluxo.estado === 'jogando') { atualizarInimigos(dt); atualizarProjeteisInimigos(dt); Rajada.atualizar(dt); Escudo.atualizar(dt); Explosao.atualizar(dt); Gravidade.atualizar(dt); atualizarPerigos(dt); TK.atualizar(dt); Supremacia.atualizar(dt); Vazio.atualizar(dt); Ilusao.atualizar(dt); Devorador.atualizarMundo(dt); }
  else if (Fluxo.estado === 'cena') { Rajada.atualizar(dt); atualizarPerigos(dt); }
  Supremacia.atualizarCristais(dt);
  atualizarObjetos(dt);
  atualizarOrbes(dt);
  atualizarParticulas(dt);
  atualizarCamera(dt);
  Fluxo.atualizar(dt);
  Perfil.atualizar(dt);
}
function quadro(agora) {
  requestAnimationFrame(quadro);
  const dt = Math.min(0.1, (agora - ultimoQuadro) / 1000);
  ultimoQuadro = agora;
  if (document.hidden) return;
  acumulado += dt;
  let n = 0;
  while (acumulado >= PASSO && n < 6) { atualizar(PASSO); acumulado -= PASSO; n++; }
  if (n >= 6) acumulado = 0;
  Render.desenhar();
  Hud.atualizar(dt);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (Fluxo.estado === 'jogando') Fluxo.alternarPausa(); Perfil.gravar(); } });
